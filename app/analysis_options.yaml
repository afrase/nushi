include:
  - package:very_good_analysis/analysis_options.yaml
  - ../analysis_options.yaml

analyzer:
  exclude:
    - lib/gen/**
    - build/**
    - macos/**

linter:
  rules:
    # The app isn't a library: its public names are for its own files, and
    # the widgets' names say what they are.
    public_member_api_docs: false
    # Still to fix, one step each (until then off):
    always_use_package_imports: false
    unnecessary_type_name_in_constructor: false
    always_put_required_named_parameters_first: false
    avoid_multiple_declarations_per_line: false
