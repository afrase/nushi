include:
  - package:very_good_analysis/analysis_options.yaml
  - ../analysis_options.yaml

analyzer:
  exclude:
    - lib/gen/**
    - build/**
    - macos/**

linter:
  rules:
    # The app isn't a library: its public names are for its own files, and
    # the widgets' names say what they are.
    public_member_api_docs: false
