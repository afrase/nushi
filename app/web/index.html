<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Nushi on the phone: your Mac's chats with coding agents.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E1F22">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nushi">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="app.css">
  <title>Nushi</title>
</head>
<body>
  <!-- data-cfasync="false": Cloudflare's Rocket Loader, if the zone has it
       on, leaves the script alone (its own loader is refused by the CSP).
       Flutter draws into #app, which keeps clear of the notch and the home
       indicator (app.css); no script is inline (the relay's CSP). -->
  <!-- Shown until the app draws (its first load is several MB), or with
       why it couldn't start. -->
  <div id="loading" role="status">
    <div class="spinner"></div>
    <p id="loading-text">Loading Nushi…</p>
  </div>
  <div id="app"></div>
  <script src="flutter_bootstrap.js" async data-cfasync="false"></script>
</body>
</html>
