name: nushi
description: Nushi, a chat wrangler and diff viewer for coding agents.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectrpc: ^2.0.1
  desktop_drop: ^0.8.4
  diff_view: ^0.1.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  markdown_view:
    path: ../packages/markdown
  pasteboard: ^0.5.0
  protobuf: ^6.1.0
  qr: ^4.0.0
  re_highlight: ^0.0.3
  svg_path:
    path: ../packages/svg_path
  uds_transport:
    path: ../packages/uds_transport
  url_launcher: ^6.3.3
  xterm2: ^5.4.0

dev_dependencies:
  fixnum: ^1.1.1
  flutter_test:
    sdk: flutter
  remote_transport:
    path: ../packages/remote_transport
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSans.ttf
        - asset: fonts/IBMPlexSans-Italic.ttf
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono.ttf
    # Nerd Fonts 3.5.1's symbols only (MIT), the terminal's fallback.
    - family: Symbols Nerd Font Mono
      fonts:
        - asset: fonts/SymbolsNerdFontMono-Regular.ttf
