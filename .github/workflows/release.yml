name: Release

# Publishing a GitHub release (Draft a new release, a new tag vX.Y.Z on main, Publish) builds that tag, attaches
# Nushi-X.Y.Z.zip, the Linux app's nushi-X.Y.Z-linux-{amd64,arm64}.tar.gz, the relays' tarballs (the web app built in, ADR 0113) and a
# .sha256 for each to the release, and updates the casks in afrase/homebrew-tap (ADR 0055). A draft triggers nothing
# until it is published. Run it by hand to rebuild an existing release's files. The app (macOS), the Linux app (on each
# architecture: Flutter doesn't cross-build), the relays (Linux, with the web app) build in parallel jobs, beside the
# check; publish attaches them once all are built and the commit is checked, then casks writes the casks, undraft
# makes the release public and tap pushes them (security.md's Releases says what runs with which token). A published
# release is a draft while it builds (draft makes it one at once, undraft public again once its files and casks are
# there), so neither the update check nor the casks offer it without its files; one whose run fails stays a draft
# (withdraw makes sure). CI builds, installs and starts the Linux app, and builds the relays with the web app, with
# the same steps (tools/release.sh's linux and relay parts) on every push, since this can't run before a release.
# Actions are pinned by commit, as in CI.
# Each job that runs steps has a timeout, as CI's do: two to three times its longest recent run (2026-10-29), room
# for a cold cache.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build (vX.Y.Z)
        required: true

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # The Flutter every job builds with; ci.yml names the same one (the release builds with CI's, ADR 0055).
  NUSHI_FLUTTER_VERSION: 3.47.7

jobs:
  # A public release is offered as an update at once (internal/features/updates reads tags, not files), so this run's
  # first job makes it a draft, which neither the update check nor the casks see, and undraft makes it public again
  # once its files and casks are there. It first reads the latest release and the newest beta, as casks would: once a
  # draft, this release is in neither, and the token casks has can't see a draft. By the release's id, which the
  # event gives: a draft is found by its tag only through a list. On a published release's run only: a run by hand
  # rebuilds a release as it is. It checks nothing out: its one step is this file's.
  draft:
    name: Make the release a draft while it builds
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.draft.outputs.latest }}
      beta: ${{ steps.draft.outputs.beta }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ github.event.release.id }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          beta=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)][0].tagName // ""')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=true --silent
          echo "$TAG is a draft until it is built (the latest release is $latest, the newest beta ${beta:-none})."

  tag:
    name: Check the tag and CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
      checked: ${{ steps.ci.outputs.checked }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Release tags look like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # CI has usually checked this commit already; only a commit without a passing CI run of every job (one
      # cancelled by a newer push, or one whose change let CI skip jobs, ADR 0129) is checked here, by the ci job,
      # which runs them all. Only a push's run counts: a pull request's run is listed under its head commit but tested
      # the merge of it into the base. CI's Mac app build skipped doesn't count: the app job here is that build.
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --event push --commit "$SHA" --status success --json databaseId --jq '.[].databaseId'); do
            skipped=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "skipped" and .name != "App build (macOS)")] | length')
            if [ "$skipped" = 0 ]; then echo "CI passed on $SHA, every job run ($id)."; echo "checked=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "CI run $id skipped $skipped jobs."
          done
          echo "No passing CI run of every job for $SHA; the ci job checks it."
          echo "checked=false" >> "$GITHUB_OUTPUT"

  ci:
    needs: tag
    if: needs.tag.outputs.checked != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}

  app:
    name: Build the app (macOS)
    needs: tag
    # What CI's macos-latest is (macos-26-arm64): the daemon is cgo, built for arm64.
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SHA: ${{ needs.tag.outputs.sha }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      # Full history: the build number is the commit count.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      - run: tools/release.sh "$VERSION" app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-app
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build the Linux app (${{ matrix.arch }})
    needs: tag
    # The oldest Ubuntu Nushi supports, so the package needs no newer glibc than its (ci.yml's linux-package job).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    permissions:
      contents: read
    env:
      SHA: ${{ needs.tag.outputs.sha }}
      VERSION: ${{ needs.tag.outputs.version }}
      NUSHI_GLIBC: '2.34'
    steps:
      # Full history: the build number is the commit count.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: matrix.arch == 'amd64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      # No SDK archive for arm64 Linux: Flutter's repository at the tag, as in CI.
      - if: matrix.arch == 'arm64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter
          key: flutter-linux-arm64-${{ env.NUSHI_FLUTTER_VERSION }}
      - if: matrix.arch == 'arm64'
        run: |
          [ -d ~/flutter ] || git clone --depth 1 -b "$NUSHI_FLUTTER_VERSION" https://github.com/flutter/flutter.git ~/flutter
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev
      - run: tools/release.sh "$VERSION" linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  relay:
    name: Build the relays with the web app (Linux)
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SHA: ${{ needs.tag.outputs.sha }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The relay has the phone's web app built in (ADR 0113), so this job builds that first.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      # make web's fallback fonts (21 MB from Google's font host, each checked against fonts.lock's sha256), under the
      # key CI's web job uses, which fills it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nushi/fallback-fonts
          key: fallback-fonts-${{ runner.os }}-${{ hashFiles('tools/webbuild/fonts.lock') }}
      - run: tools/release.sh "$VERSION" relay
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-relay
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Attaches the builds' files, to the draft on a published release's run (gh finds a draft by its tag). One of the
  # jobs with contents: write on this repository (with draft, undraft and withdraw), it checks nothing out and runs no
  # code of the tag's but this file: its steps are this file's and pinned actions.
  publish:
    name: Attach the files
    needs: [tag, ci, app, linux, relay]
    # The ci job is skipped when CI already passed on the commit; anything else must have succeeded.
    if: >-
      !cancelled() && needs.tag.result == 'success' && needs.app.result == 'success' &&
      needs.linux.result == 'success' && needs.relay.result == 'success' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only the builds' files: the ci job's own artifacts (the Linux app's screenshots) are in this run too.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # A published release whose run failed or was cancelled before undraft made it public stays a draft: draft made it
  # one, and this job makes sure, for when draft itself failed. Re-running the failed jobs finishes it (undraft makes
  # it public); publishing the draft again builds it all again. A run by hand rebuilds a release as it is, so it leaves
  # it alone. The job checks nothing out: its one step is this file's.
  withdraw:
    name: Keep the release a draft
    needs: [draft, tag, ci, app, linux, relay, publish, casks, undraft]
    # A job GitHub itself cancels (no runner in time) fails nothing and cancels no run: its result says so.
    if: >-
      always() && github.event_name == 'release' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Make the release a draft
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ github.event.release.id }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=true --silent
          echo "::error::$TAG wasn't built, attached and its casks written, so it stays a draft: re-run the failed jobs once what failed is fixed (a fix in the code needs a new tag)."

  # The latest release updates nushi, and nushi@beta with it; the newest beta (a pre-release of a later version)
  # nushi@beta alone (ADR 0108); an older one built again by hand neither. The tag's tools/cask.sh says which and
  # writes them here, in a job whose token reads only, given to the first step alone, which runs none of the tag's
  # code. The tap job pushes what it wrote: the tag's code and the tap's token never share a job, since a step's code
  # can outlast its step on the runner (which has sudo) and read a later step's environment.
  casks:
    name: Write the Homebrew casks
    needs: [draft, tag, publish]
    # Said outright: the ci job (or draft, on a run by hand) skipped further up would skip this job too by default.
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SHA: ${{ needs.tag.outputs.sha }}
      VERSION: ${{ needs.tag.outputs.version }}
    outputs:
      casks: ${{ steps.write.outputs.casks }}
    steps:
      # On a published release's run, as draft read them before this release became a draft; a run by hand reads them.
      - name: Read the latest release and the newest beta
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT_LATEST: ${{ needs.draft.outputs.latest }}
          DRAFT_BETA: ${{ needs.draft.outputs.beta }}
        run: |
          if [ "$EVENT" = release ]; then
            latest=$DRAFT_LATEST beta=$DRAFT_BETA
          else
            latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            beta=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease)][0].tagName // ""')
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-app
          path: dist
      # A tag from before tools/cask.sh (ADR 0108) is older than the releases that have it, so it updates no cask.
      - name: Write the casks
        id: write
        env:
          LATEST: ${{ steps.releases.outputs.latest }}
          BETA: ${{ steps.releases.outputs.beta }}
        run: |
          if [ ! -f tools/cask.sh ]; then
            if [ "$TAG" = "$LATEST" ]; then
              echo "::error::$TAG is the latest release but has no tools/cask.sh to write its casks; update the tap by hand."; exit 1
            fi
            echo "$TAG predates tools/cask.sh and isn't the latest release ($LATEST); no cask is updated."; exit 0
          fi
          casks=$(tools/cask.sh which "$TAG" "$LATEST" "$BETA" | xargs)
          if [ -z "$casks" ]; then
            echo "$TAG is neither the latest release ($LATEST) nor the newest beta (${BETA:-none}); no cask is updated."; exit 0
          fi
          sha=$(cut -d ' ' -f 1 "dist/Nushi-$VERSION.zip.sha256")
          mkdir -p "$RUNNER_TEMP/casks"
          for cask in $casks; do tools/cask.sh write "$cask" "$VERSION" "$sha" > "$RUNNER_TEMP/casks/$cask.rb"; done
          echo "casks=$casks" >> "$GITHUB_OUTPUT"
      - if: steps.write.outputs.casks != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: casks
          path: ${{ runner.temp }}/casks/
          if-no-files-found: error
          retention-days: 1

  # The release made public again, last: its files are attached and its casks written. A pre-release stays one (only
  # draft and make_latest are sent), and it is the latest again only if it was when the run began. With this run's own
  # token, never the tap's: an event that token makes starts no workflow, so publishing doesn't run this file again.
  # Before tap, since a cask's download from a draft finds nothing.
  undraft:
    name: Make the release public
    needs: [draft, casks]
    if: "!cancelled() && needs.draft.result == 'success' && needs.casks.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ github.event.release.id }}
          LATEST: ${{ needs.draft.outputs.latest }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .draft)" != true ]; then
            echo "$TAG is public already."; exit 0
          fi
          if [ "$LATEST" = "$TAG" ]; then latest=true; else latest=false; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest="$latest" --silent
          echo "$TAG is public (the latest release: $latest)."

  # Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained token with Contents read and write on afrase/homebrew-tap
  # only; without it the casks are left alone. It runs no code of the tag's but this file: it checks nothing out, and
  # takes the casks job's names and files as data, only nushi and nushi@beta, each a plain file.
  tap:
    name: Update the Homebrew tap
    needs: [tag, casks, undraft]
    # undraft is skipped on a run by hand, whose release is as it was.
    if: >-
      !cancelled() && needs.casks.result == 'success' && needs.casks.outputs.casks != '' &&
      (needs.undraft.result == 'success' || needs.undraft.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: casks
          path: casks
      - name: Push the casks
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CASKS: ${{ needs.casks.outputs.casks }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::No HOMEBREW_TAP_TOKEN secret; the casks aren't updated."; exit 0; fi
          set -f # the names are data: no globbing
          for cask in $CASKS; do
            case "$cask" in
            nushi | nushi@beta) ;;
            *) echo "::error::No cask is named $cask."; exit 1 ;;
            esac
            if [ ! -f "casks/$cask.rb" ] || [ -L "casks/$cask.rb" ]; then echo "::error::casks/$cask.rb isn't a file."; exit 1; fi
          done
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/afrase/homebrew-tap.git" tap
          mkdir -p tap/Casks
          for cask in $CASKS; do cp "casks/$cask.rb" "tap/Casks/$cask.rb"; done
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          if git diff --cached --quiet; then echo "$CASKS: already at $VERSION."; exit 0; fi
          git commit -m "$CASKS $VERSION"
          git push
