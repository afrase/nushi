# What make check runs, as parallel jobs (one job of 12 minutes before, until 2026-10-27). macOS for what needs it, in four
# jobs (the account runs five macOS jobs at once, and a release or another repository's CI needs one too): the
# daemon (proc_info, sandbox-exec, launchd, the keychain's cgo), so Go's lint and tests, with the window's placement
# maths (swiftc); the web app's end-to-end test
# (nushid with Chrome); and the app's tests in two shards of test files (its goldens are drawn with macOS's text
# rendering: on Linux a third of them differ by 1-4%; its end-to-end tests run nushid). Linux for the rest: the
# protos' and Dart's lint, the Dart packages' tests, and the daemon on Linux (ADR 0101): every Go package's tests,
# lint, build and vet without cgo; and the Linux app (ADR 0102): its tests in two shards (goldens are compared on macOS
# only), and its package built on each architecture as the release builds it (tools/release.sh's linux part, on the
# oldest Ubuntu it supports, for the glibc it needs), installed and started on a virtual display (tools/linux-smoke.sh),
# with the runner's channels tested for real on amd64 (tools/linux-channels.sh). The ACP library,
# github.com/afrase/acp-go, has its own CI. Actions are pinned by commit.
#
# Each job's timeout is two to three times its longest recent run with warm caches (2026-10-29: Go 4.4 minutes, the
# app's shards 6.2, the web 7.1, Linux's 2 at most), room for a cold cache's downloads and builds: a hung test ends
# there, not at GitHub's six hours on a scarce macOS runner. Linux's Go job runs every package's tests from 2026-11-08
# (a minute in an x86 VM with the build cached, unmeasured on CI yet): 25 until it has run there. The Linux app's jobs
# (from 2026-11-09) are unmeasured too: 25 for its tests, 30 for its package (a cold Flutter build), until they have
# run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release's check, on a tag no CI run passed on.
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Flutter every job builds with; release.yml names the same one (the release builds with CI's, ADR 0055).
  NUSHI_FLUTTER_VERSION: 3.47.7

jobs:
  go:
    name: Go lint and tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    # The tests in a new order each run: one that passes only after another shows (the log has the seed).
    env:
      GOTESTFLAGS: -shuffle=on
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/lint/go.sum
      # golangci-lint and govulncheck as built: they change with their module and Go.
      - id: lint-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/golangci-lint
            bin/govulncheck
          key: lint-tools-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('tools/lint/go.mod', 'tools/lint/go.sum') }}
      # make goes by modification times, and the checkout's go.sum is newer than the cached binaries.
      - if: steps.lint-tools.outputs.cache-hit == 'true'
        run: touch bin/golangci-lint bin/govulncheck
      # golangci-lint's results per package, kept from the last run (saved under each commit).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('tools/lint/go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: golangci-lint-${{ runner.os }}-${{ hashFiles('tools/lint/go.sum', '.golangci.yml') }}-
      - run: make lint-go
      # The tests run when the lint fails too, to see both.
      - if: ${{ !cancelled() }}
        run: make test-go
      - if: ${{ !cancelled() }}
        run: make test-window

  lint:
    name: Proto and Dart lint (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # buf is go run at the version the Makefile names.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            Makefile
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      - run: make lint-dart
      # The committed API code is what make gen makes from the protos, with the plugins it pins.
      - if: ${{ !cancelled() }}
        run: |
          make gen
          git diff --exit-code -- internal/gen app/lib/gen
          test -z "$(git status --porcelain -- internal/gen app/lib/gen)"

  packages:
    name: Dart packages (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # remote_transport's interop test builds a Go peer.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      - run: make test-packages

  app:
    name: App tests (macOS, ${{ matrix.shard }}/2)
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Three test files at once: the runner has three cores, and flutter test takes half of them (one).
    env:
      SHARD: ${{ matrix.shard }}/2
      FLUTTER_TEST_FLAGS: --concurrency 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The end-to-end tests build nushid, nushi-relay and the fake agent.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Built here in each job that shares this Go cache, so whichever saves it first (a shard whose tests build
      # nothing, say) leaves them in it.
      - run: go build ./cmd/nushid ./cmd/nushi-relay ./internal/acptest/fakeagent
      # The SDK cached without what the tests never use (below): 0.9 GB to fetch, not 2.1.
      - id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-lean
      - run: make test-app
      # A golden that differs on the runner: its images, to see why.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures-${{ matrix.shard }}
          path: app/test/failures/
          if-no-files-found: ignore
          retention-days: 7
      # Before the cache is saved (a miss only): iOS's, Android's and macOS's release engines go, which only
      # builds use; flutter test needs the host's engine and the web SDK. Their stamps go too, so a build would
      # fetch them again.
      - if: always() && steps.flutter.outcome == 'success' && steps.flutter.outputs.CACHE-HIT != 'true'
        run: |
          du -sh "$FLUTTER_ROOT"
          cd "$FLUTTER_ROOT/bin/cache"
          rm -rf artifacts/engine/ios* artifacts/engine/android-* artifacts/engine/darwin-x64-profile \
            artifacts/engine/darwin-x64-release ios-sdk.stamp macos-sdk.stamp android-*.stamp
          du -sh "$FLUTTER_ROOT"

  web:
    name: Web app in Chrome (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Its test builds nushid, nushi-relay and the fake agent.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # As the app's tests do.
      - run: go build ./cmd/nushid ./cmd/nushi-relay ./internal/acptest/fakeagent
      # The lean SDK, as the app's tests have it.
      - id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-lean
      - run: make test-web
      # As the app's tests do.
      - if: always() && steps.flutter.outcome == 'success' && steps.flutter.outputs.CACHE-HIT != 'true'
        run: |
          du -sh "$FLUTTER_ROOT"
          cd "$FLUTTER_ROOT/bin/cache"
          rm -rf artifacts/engine/ios* artifacts/engine/android-* artifacts/engine/darwin-x64-profile \
            artifacts/engine/darwin-x64-release ios-sdk.stamp macos-sdk.stamp android-*.stamp
          du -sh "$FLUTTER_ROOT"

  linux:
    name: Go packages (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # As on the Mac: the tests in a new order each run.
    env:
      GOTESTFLAGS: -shuffle=on
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/lint/go.sum
      # golangci-lint as built, as in the macOS job (make lint-linux runs it for Linux).
      - id: lint-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/golangci-lint
          key: lint-tools-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('tools/lint/go.mod', 'tools/lint/go.sum') }}
      - if: steps.lint-tools.outputs.cache-hit == 'true'
        run: touch bin/golangci-lint
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('tools/lint/go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: golangci-lint-${{ runner.os }}-${{ hashFiles('tools/lint/go.sum', '.golangci.yml') }}-
      # npm's install runs under bubblewrap on Linux (internal/npm's tests run it); Ubuntu's AppArmor denies it
      # unprivileged user namespaces unless that rule is off.
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: make test-go
      # Everything builds, vets and lints for Linux without cgo: macOS-only code stays in _darwin.go files (ADR 0097).
      - if: ${{ !cancelled() }}
        run: make lint-linux
      # go.mod and go.sum name what the code imports, no more and no less.
      - if: ${{ !cancelled() }}
        run: go mod tidy -diff

  linux-app:
    name: App tests (Linux, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Four test files at once: the runner has four cores.
    env:
      SHARD: ${{ matrix.shard }}/2
      FLUTTER_TEST_FLAGS: --concurrency 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The end-to-end tests build nushid, nushi-relay and the fake agent, as on macOS.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./cmd/nushid ./cmd/nushi-relay ./internal/acptest/fakeagent
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      - run: make test-app

  linux-package:
    name: App (Linux, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    # The newest glibc the package may need, which docs/install.md names (tools/check-bundle.sh): what a build needs
    # even on a newer glibc (__libc_start_main's 2.34), so RHEL 9's runs it.
    env:
      NUSHI_GLIBC: '2.34'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: matrix.arch == 'amd64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      # Flutter publishes no SDK archive for arm64 Linux: its repository at the tag, which fetches its own Dart and
      # engine on first use (the same steps as release.yml's).
      - if: matrix.arch == 'arm64'
        id: flutter-arm64
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter
          key: flutter-linux-arm64-${{ env.NUSHI_FLUTTER_VERSION }}
      - if: matrix.arch == 'arm64'
        run: |
          [ -d ~/flutter ] || git clone --depth 1 -b "$NUSHI_FLUTTER_VERSION" https://github.com/flutter/flutter.git ~/flutter
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      # Flutter's Linux build (its docs' list), and what the smoke test and the channels' test run on.
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev xvfb xauth dbus libgl1-mesa-dri imagemagick xclip
      - run: tools/release.sh 0.0.0-ci linux
      - run: SHOT=dist/linux-${{ matrix.arch }}.png tools/linux-smoke.sh dist/nushi-0.0.0-ci-linux-${{ matrix.arch }}.tar.gz
      # The window as the smoke test left it, to look at (the only look at arm64's).
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}-screenshot
          path: dist/linux-${{ matrix.arch }}.png
          if-no-files-found: ignore
          retention-days: 7
      - if: ${{ !cancelled() && matrix.arch == 'amd64' }}
        run: tools/linux-channels.sh
