# What make check runs, as parallel jobs. macOS for what needs it, in four jobs (the account runs five macOS jobs at
# once, and a release or another repository's CI needs one too): the
# daemon (proc_info, sandbox-exec, launchd, the keychain's cgo), so Go's lint and tests side by side, with the window's
# placement maths (swiftc); and the app's test files that need a Mac, in three shards: those with goldens, drawn with
# macOS's text rendering (on Linux a third of them differ by 1-4%), and those reading the Mac's own fonts; a fifth, the
# Mac app packaged, only for a change to what it reads (macos-app). Linux for the
# rest: the protos' and Dart's lint, the Dart packages' tests, the web app's end-to-end test (nushid with Chrome) and
# the relays with the web app built in, as the release builds them (tools/release.sh's relay part), and
# the daemon on Linux (ADR 0101): every Go package's tests, its lint without cgo for Linux (golangci-lint type-checks
# and vets), and its build, vet and lint for Windows; and the Linux app (ADR 0104): every other app test file, in three shards, and its package built on each
# architecture as the release builds it (tools/release.sh's linux part, on the oldest Ubuntu it supports, for the glibc
# it needs), installed and started on a virtual display (tools/linux-smoke.sh), with the runner's channels tested for
# real on amd64 (tools/linux-channels.sh); Windows for the daemon's Windows-only tests and the Windows app's build
# (its C++ runner compiled, ADR 0125). tools/test-shards says which app test files are whose and splits each set by
# app/test/timings.tsv, slowest first (ADR 0129); a shard's count is its matrix's, nowhere else. The ACP library,
# github.com/afrase/acp-go, has its own CI. Actions are pinned by commit.
#
# A push or a pull request runs only the jobs its change can affect (the changes job, tools/ci-changes.sh): a docs-only
# change none, a Go-only one all but the golden shards and the Windows app's build, an app-only one all but Go's four
# jobs; the Mac app's build runs only for what it reads (app/macos, the app's plugins, cmd/, and what runs everything).
# Anything else, and any path it can't place, runs everything; the release counts only a run that skipped nothing but
# the Mac app's build, which it does itself (release.yml).
#
# Each job's timeout is two to three times its longest recent run with warm caches (2026-11-16: Go's tests on macOS 4.1
# minutes, the web 2.4 on Linux, Linux's Go 3), room for a cold cache's downloads and builds: a hung test ends there, not
# at GitHub's six hours on a scarce macOS runner. The app's shards: 15, over twice their longest by time (5.7 minutes,
# 2026-11-16). Windows', the Linux package's and the Windows app's (a cold Flutter build) are as they were, or as the
# nearest job's.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release's check, on a tag no CI run passed on.
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true

permissions:
  contents: read

# A pull request's newer push cancels its older run: each run tests the whole branch. Main's pushes don't cancel
# each other: each run tests only what its own push changed (ADR 0129), so a docs-only push cancelling a run would
# leave the code before it untested.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Flutter every job builds with; release.yml names the same one (the release builds with CI's, ADR 0055).
  NUSHI_FLUTTER_VERSION: 3.47.7

jobs:
  # What the change can affect (tools/ci-changes.sh, ADR 0129): the other jobs run only for it. A pull request's whole
  # branch, a push's own commits; any other event (the release's call) runs everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.paths.outputs.go }}
      app: ${{ steps.paths.outputs.app }}
      code: ${{ steps.paths.outputs.code }}
      mac: ${{ steps.paths.outputs.mac }}
    steps:
      # The history without its files' contents: the diff needs only names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: tools/ci-changes.sh "$EVENT" "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  go:
    name: Go lint and tests (macOS)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    # The tests in a new order each run: one that passes only after another shows (the log has the seed).
    env:
      GOTESTFLAGS: -shuffle=on
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/lint/go.sum
      # golangci-lint and govulncheck as built: they change with their module and Go.
      - id: lint-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/golangci-lint
            bin/govulncheck
          key: lint-tools-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('tools/lint/go.mod', 'tools/lint/go.sum') }}
      # make goes by modification times, and the checkout's go.sum is newer than the cached binaries.
      - if: steps.lint-tools.outputs.cache-hit == 'true'
        run: touch bin/golangci-lint bin/govulncheck
      # golangci-lint's results per package: one entry a week, saved by main's pushes only (one under each commit
      # filled the repository's 10 GB of caches and pushed out Flutter's SDKs). The week's key, or the newest before.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - id: lint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('tools/lint/go.sum', '.golangci.yml') }}-${{ steps.week.outputs.week }}
          restore-keys: golangci-lint-${{ runner.os }}-${{ hashFiles('tools/lint/go.sum', '.golangci.yml') }}-
      # The lint beside the tests (they wait on processes and timers much of their time), its output after theirs
      # (macOS's make 3.81 can't keep two jobs' output apart); then the window's placement maths. Each runs whatever
      # the others did, to see every failure.
      - run: |
          make lint-go > "$RUNNER_TEMP/lint-go.log" 2>&1 &
          lint=$!
          make test-go && tests=0 || tests=$?
          wait "$lint" && lint=0 || lint=$?
          echo "make lint-go, beside the tests (exit $lint):"
          cat "$RUNNER_TEMP/lint-go.log"
          make test-window && window=0 || window=$?
          [ "$tests$lint$window" = 000 ]
      - if: ${{ !cancelled() && github.event_name == 'push' && steps.lint-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/golangci-lint
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}

  lint:
    name: Proto and Dart lint (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # buf is go run at the version the Makefile names.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            Makefile
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      # buf breaking compares the protos with the change's base (a pull request's base, a push's before), fetched
      # alone; with none (the release's call, a new branch) it is skipped.
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case $BASE in *[!0]*) git fetch --depth=1 --no-tags origin "$BASE" ;; *) BASE= ;; esac
          make lint-dart BREAKING_BASE="$BASE"
      # What the changes job says a change can affect, against its table.
      - if: ${{ !cancelled() }}
        run: tools/ci-changes.sh --self-test
      # The committed API code is what make gen makes from the protos, with the plugins it pins.
      - if: ${{ !cancelled() }}
        run: |
          make gen
          git diff --exit-code -- internal/gen app/lib/gen
          test -z "$(git status --porcelain -- internal/gen app/lib/gen)"

  packages:
    name: Dart packages (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # daemon_transport's interop test builds a Go peer, one small program: no cache, so this short job never saves
      # the Linux key the web and app jobs share with its few packages in it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      - run: make test-packages

  goldens:
    name: App goldens (macOS, ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    # Three shards, not two: a slow macOS host runs these files three to four times slower than a fast one (2026-11-16:
    # 104 s and 448 s for the same weight in one run), and the run waits for the slowest shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Three test files at once: the runner has three cores, and flutter test takes half of them (one). Each file's
    # tests in a random order, as Go's are (-shuffle=on): a test that passes only after another fails here; flutter
    # test prints the seed first, for make test-app FLUTTER_TEST_FLAGS=--test-randomize-ordering-seed=<seed>.
    env:
      SET: macos
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      FLUTTER_TEST_FLAGS: --concurrency 3 --test-randomize-ordering-seed=random --file-reporter json:build/test-times.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Go only for tools/test-shards, so no cache to fetch: no file of this set builds Go (test-shards -check).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The SDK cached without what the tests never use (below): 0.9 GB to fetch, not 2.1.
      - id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-lean
      - run: make test-app
      # Each file's times, for make test-timings RUN=<this run> (app/test/timings.tsv).
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-times-${{ env.SET }}-${{ matrix.shard }}
          path: app/build/test-times.json
          if-no-files-found: ignore
          retention-days: 30
      # A golden that differs on the runner: its images, to see why.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures-${{ matrix.shard }}
          path: app/test/failures/
          if-no-files-found: ignore
          retention-days: 7
      # Before the cache is saved (a miss only): iOS's, Android's and macOS's release engines go, which only
      # builds use; flutter test needs the host's engine and the web SDK. Their stamps go too, so a build would
      # fetch them again.
      - if: always() && steps.flutter.outcome == 'success' && steps.flutter.outputs.CACHE-HIT != 'true'
        run: |
          du -sh "$FLUTTER_ROOT"
          cd "$FLUTTER_ROOT/bin/cache"
          rm -rf artifacts/engine/ios* artifacts/engine/android-* artifacts/engine/darwin-x64-profile \
            artifacts/engine/darwin-x64-release ios-sdk.stamp macos-sdk.stamp android-*.stamp
          du -sh "$FLUTTER_ROOT"

  # On Linux: nushid runs there (ADR 0101) and the image has Chrome, which frees a macOS runner. Then the relays with
  # the web app built in, as the release's relay job builds them (tools/release.sh's relay part, into dist/, published
  # nowhere): make web stops on a Flutter whose engine fonts.lock doesn't name, on app/fonts changed without make
  # web-cut, or on a moved placeholder in Flutter's files, which otherwise first shows on a public release. Unmeasured
  # yet: 20, the tests' 15 with room for the build (the release's relay job allows 10).
  web:
    name: Web app in Chrome (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Its test builds nushid, nushi-relay and the fake agent.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # As the app's tests do.
      - run: go build ./cmd/nushid ./cmd/nushi-relay ./internal/acptest/fakeagent
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      - run: make test-web
      # make web's fallback fonts, under the release's relay job's key (21 MB from Google's font host, each checked
      # against fonts.lock's sha256): main's runs fill what the release reads.
      - if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nushi/fallback-fonts
          key: fallback-fonts-${{ runner.os }}-${{ hashFiles('tools/webbuild/fonts.lock') }}
      # make mermaid's mermaid.min.js (5.4 MB from a CDN, checked against mermaid.lock), kept per lock.
      - if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nushi/mermaid
          key: mermaid-${{ runner.os }}-${{ hashFiles('tools/mermaid/mermaid.lock') }}
      - if: ${{ !cancelled() }}
        run: tools/release.sh 0.0.0-ci relay

  linux:
    name: Go tests (Linux)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # As on the Mac: the tests in a new order each run.
    env:
      GOTESTFLAGS: -shuffle=on
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # A cache key of its own (go.mod beside go.sum, which no other job keys on): its -race build of every package
      # isn't what the web and app jobs build, and whichever job saves a shared key first decides what it holds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod
      # npm's install runs under bubblewrap on Linux (internal/npm's tests run it); Ubuntu's AppArmor denies it
      # unprivileged user namespaces unless that rule is off.
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap dbus-daemon libglib2.0-bin gnupg openssh-client procps util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: make test-go
      # go.mod and go.sum name what the code imports, no more and no less.
      - if: ${{ !cancelled() }}
        run: go mod tidy -diff

  # Beside Linux's tests, not after them: the two lints took as long as the tests (2026-11-16).
  linux-lint:
    name: Go lint (Linux, Windows)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/lint/go.sum
      # golangci-lint as built, as in the macOS job (make lint-linux runs it for Linux).
      - id: lint-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/golangci-lint
          key: lint-tools-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('tools/lint/go.mod', 'tools/lint/go.sum') }}
      - if: steps.lint-tools.outputs.cache-hit == 'true'
        run: touch bin/golangci-lint
      # Its results as on the Mac: one entry a week, saved by main's pushes.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - id: lint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('tools/lint/go.sum', '.golangci.yml') }}-${{ steps.week.outputs.week }}
          restore-keys: golangci-lint-${{ runner.os }}-${{ hashFiles('tools/lint/go.sum', '.golangci.yml') }}-
      # Everything builds, vets and lints for Linux without cgo: macOS-only code stays in _darwin.go files (ADR 0097).
      - run: make lint-linux
      # Everything builds, vets and lints for Windows, tests included: what macOS and Linux share stays in _unix.go files (ADR 0124).
      - if: ${{ !cancelled() }}
        run: make lint-windows
      - if: ${{ !cancelled() && github.event_name == 'push' && steps.lint-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}

  windows:
    # The Windows-only tests run on Windows itself (ADR 0124): the processes' job objects and handles, the data
    # folder's DACL, the app's stop event (ADR 0134), batch-file shims, locks, logs, the shell's environment and
    # Claude's history there; every package's tests build there too, but the rest assume Unix. The daemon is built as
    # the app runs it. Unmeasured yet: 20 until it has run.
    name: Go on Windows
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # gofmt and the tests' fixtures want the files as committed, not with CRLF line ends.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - env:
          CGO_ENABLED: "0"
        run: go build -o bin/nushid.exe ./cmd/nushid
      - if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./internal/procgroup ./internal/filelock ./internal/logs ./internal/shellenv ./internal/batchfile ./internal/terminal ./internal/proctree ./internal/listeners ./internal/footprint
          go test -run 'TestAlive|TestOpenWindows' ./internal/claudehistory
          go test -run 'TestOwnDataFolder|TestWTDefaultLine|TestMachineFragment|TestStopEvent' ./cmd/nushid

  # The Windows app built (ADR 0125), build only: CI's one compile of its C++ runner (WebView2's host, ADR 0134),
  # whose first build fetches WebView2's pinned SDK. Nothing of it runs here. Unmeasured yet: 30, as the Linux
  # package's cold build.
  windows-app:
    name: App build (Windows)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: flutter build windows

  # The Mac app packaged as a release packages it (tools/release.sh's app part, make package: every Runner Swift file,
  # the plugins, the bundle, signed ad hoc and checked by tools/check-bundle.sh), build only: otherwise first built
  # once a release is public. Only when the change touches what that build reads beyond the Dart and Go the other
  # jobs compile (app/macos, the app's plugins, cmd/, the Makefile, tools/, packaging/; tools/ci-changes.sh), and not
  # in the release's call, whose own app job builds it the same way. As long as the release's app job (20): about 5
  # minutes warm.
  macos-app:
    name: App build (macOS)
    needs: changes
    if: needs.changes.outputs.mac == 'true' && !inputs.ref
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      # make mermaid's mermaid.min.js (5.4 MB from a CDN, checked against mermaid.lock), kept per lock.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/nushi/mermaid
          key: mermaid-${{ runner.os }}-${{ hashFiles('tools/mermaid/mermaid.lock') }}
      - run: tools/release.sh 0.0.0-ci app

  linux-app:
    name: App tests (Linux, ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Four test files at once: the runner has four cores. A golden in this set fails (make test-app). Each file's tests
    # in a random order, as the macOS shards run theirs.
    env:
      SET: linux
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      FLUTTER_TEST_FLAGS: --concurrency 4 --test-randomize-ordering-seed=random --file-reporter json:build/test-times.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The end-to-end tests build nushid, nushi-relay and the fake agent.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./cmd/nushid ./cmd/nushi-relay ./internal/acptest/fakeagent
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      - run: make test-app
      # Each file's times, for make test-timings RUN=<this run> (app/test/timings.tsv).
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-times-${{ env.SET }}-${{ matrix.shard }}
          path: app/build/test-times.json
          if-no-files-found: ignore
          retention-days: 30

  linux-package:
    name: App (Linux, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    # The newest glibc the package may need, which docs/install.md names (tools/check-bundle.sh): what a build needs
    # even on a newer glibc (__libc_start_main's 2.34), so RHEL 9's runs it.
    env:
      NUSHI_GLIBC: '2.34'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: matrix.arch == 'amd64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.NUSHI_FLUTTER_VERSION }}
          cache: true
      # Flutter publishes no SDK archive for arm64 Linux: its repository at the tag, which fetches its own Dart and
      # engine on first use (the same steps as release.yml's).
      - if: matrix.arch == 'arm64'
        id: flutter-arm64
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter
          key: flutter-linux-arm64-${{ env.NUSHI_FLUTTER_VERSION }}
      - if: matrix.arch == 'arm64'
        run: |
          [ -d ~/flutter ] || git clone --depth 1 -b "$NUSHI_FLUTTER_VERSION" https://github.com/flutter/flutter.git ~/flutter
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      # Flutter's Linux build (its docs' list), and what the smoke test and the channels' test run on.
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev xvfb xauth dbus libgl1-mesa-dri imagemagick xclip
      - run: tools/release.sh 0.0.0-ci linux
      - run: SHOT=dist/linux-${{ matrix.arch }}.png tools/linux-smoke.sh dist/nushi-0.0.0-ci-linux-${{ matrix.arch }}.tar.gz
      # The window as the smoke test left it, to look at (the only look at arm64's).
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}-screenshot
          path: dist/linux-${{ matrix.arch }}.png
          if-no-files-found: ignore
          retention-days: 7
      - if: ${{ !cancelled() && matrix.arch == 'amd64' }}
        run: tools/linux-channels.sh
