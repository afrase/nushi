# Stricter Dart analysis for the app and every package, on top of
# flutter_lints (or lints for the pure-Dart packages): each includes this.
# Left out, as not fitting this code: avoid_multiple_declarations_per_line
# (`final a = 1, b = 2;` reads fine), missing_whitespace_between_adjacent_strings
# (the marks' pixel rows are adjacent strings), avoid_positional_boolean_parameters,
# cascade_invocations, parameter_assignments, prefer_expression_function_bodies,
# sort_pub_dependencies (style), require_trailing_commas (dart format decides
# commas now), prefer_int_literals (its fix turned a double 20.0 into an int
# that then failed to type-check).
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
linter:
  rules:
    - always_declare_return_types
    - avoid_bool_literals_in_conditional_expressions
    - avoid_catches_without_on_clauses
    - avoid_dynamic_calls
    - avoid_escaping_inner_quotes
    - avoid_redundant_argument_values
    - avoid_type_to_string
    - avoid_unused_constructor_parameters
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - deprecated_consistency
    - directives_ordering
    - discarded_futures
    - join_return_with_assignment
    - leading_newlines_in_multiline_strings
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_literal_bool_comparisons
    - no_runtimeType_toString
    - noop_primitive_operations
    - omit_local_variable_types
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_null_aware_method_calls
    - prefer_single_quotes
    - prefer_void_to_null
    - sized_box_shrink_expand
    - strict_top_level_inference
    - test_types_in_equals
    - throw_in_finally
    - type_annotate_public_apis
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_breaks
    - unnecessary_ignore
    - unnecessary_lambdas
    - unnecessary_null_checks
    - unnecessary_parenthesis
    - unnecessary_raw_strings
    - unnecessary_statements
    - unnecessary_to_list_in_spreads
    - unreachable_from_main
    - use_colored_box
    - use_decorated_box
    - use_enums
    - use_if_null_to_convert_nulls_to_bools
    - use_named_constants
    - use_string_buffers
    - use_truncating_division
