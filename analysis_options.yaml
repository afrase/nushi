# Dart analysis for the app and every package (ADR 0040). Each includes
# very_good_analysis, then this file, which wins where they differ.
# very_good_analysis has strict casts, inference and raw types, and 48 of
# the 54 rules ADR 0040 first added; five of the other six are on below.
# What a package turns off for itself is in its own analysis_options.yaml.
analyzer:
  errors:
    # very_good_analysis ignores close_sinks; a sink handed to its owner is
    # marked where it's handed over instead.
    close_sinks: info
linter:
  rules:
    close_sinks: true
    prefer_void_to_null: true
    unreachable_from_main: true
    use_decorated_box: true
    use_if_null_to_convert_nulls_to_bools: true
    # ADR 0040's, but very_good_analysis's async_return_with_no_await asks
    # for the opposite, and an awaited return keeps the function in the
    # error's stack trace and inside its try.
    unnecessary_await_in_return: false
    # Its fix turned a double 20.0 into an int that then failed to
    # type-check (ADR 0040).
    prefer_int_literals: false
