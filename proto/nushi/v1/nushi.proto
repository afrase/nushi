message ContextCategory {
  string name = 1;
  int64 tokens = 2;
  double percent = 3;
  // "free" for the free space, "deferred" for what is listed but loaded
  // only on demand (outside the context), else "".
  string kind = 4;
}

message GetFolderStatusRequest {
  string folder = 1;
  // As GetDiffRequest.base.
  string base = 2;
}

message GetFolderStatusResponse {
  // Whether the folder is in a git repository; nothing else is set if not.
  bool git = 1;
  // The branch checked out, or the commit when none is.
  string branch = 2;
  int32 files = 3;
  // Lines added and removed; binary files count none.
  int32 added = 4;
  int32 removed = 5;
  // The folder doesn't exist (any more); nothing else is set.
  bool gone = 6;
  // The branch a branch is counted from when the chat has no base of its
  // own: origin/HEAD's branch, else main or master; "" if none.
  string default_base = 7;
  // The commits HEAD has that the base (or else default_base) lacks
  //.
  int32 ahead = 8;
}

message ListBranchesRequest {
  string folder = 1;
}

message ListBranchesResponse {
  // 500 at most.
  repeated GitBranch branches = 1;
  // Not those whose folders are gone (git would prune them).
  repeated GitWorktree worktrees = 2;
}

message GitBranch {
  string name = 1;
  // Its last commit's time.
  int64 unix_seconds = 2;
  // The worktree that has it checked out, if one does.
  string worktree = 3;
}

message GitWorktree {
  string path = 1;
  // "" when its HEAD is detached.
  string branch = 2;
  // The repository's own folder.
  bool main = 3;
  // Locked (git worktree lock).
  bool locked = 4;
  // The folder asked about is in it.
  bool current = 5;
}

message GetDiffRequest {
  // An absolute path; it may be anywhere inside a repository.
  string folder = 1;
  // A branch: count the changes from where HEAD's branch left it (git
  // merge-base HEAD base), the branch's commits and uncommitted changes
  // together, instead of from HEAD.
  string base = 2;
  // A commit: what it changed, from its first parent, instead.
  string commit = 3;
  // With commit, an older commit: what the commits from it to commit
  // changed, it included.
  string since = 4;
}

message GetFileRequest {
  // An absolute path.
  string folder = 1;
  // Relative to folder.
  string path = 2;
}

message WatchChatFileRequest {
  string chat_id = 1;
  // Absolute, or relative to the chat's folder.
  string path = 2;
}

message FindChatFilesRequest {
  string chat_id = 1;
  // Absolute, or relative to the chat's folder; 200 at most.
  repeated string paths = 2;
}

message FindChatFilesResponse {
  // Those of the paths that are there, as given.
  repeated string found = 1;
}

// The file as it is now.
message WatchChatFileResponse {
  // Its absolute path.
  string path = 1;
  // Its bytes, left out when it's too large.
  bytes data = 2;
  int64 size = 3;
  // Over the preview's cap (a few MB).
  bool too_large = 4;
  // It isn't there, or isn't a regular file (yet).
  bool missing = 5;
}

message GetFileResponse {
  FileChange file = 1;
}

message GetDiffResponse {
  // Sorted by path.
  repeated FileChange files = 1;
}

// One file's change: its text at HEAD and now.
message FileChange {
  // Relative to the folder.
  string path = 1;
  // "added", "modified", "deleted", "renamed" (from old_path) or
  // "untracked".
  string status = 2;
  string old_text = 3;
  string new_text = 4;
  // Why the texts are left out ("binary", "too large"), if they are.
  string skipped = 5;
  // A renamed file's earlier path.
  string old_path = 6;
  // Lines added and removed; a binary file counts none.
  int32 added = 7;
  int32 removed = 8;
}

message ListCommitsRequest {
  string folder = 1;
  // HEAD's commits that base lacks (up to 500); without one the last 50.
  string base = 2;
}

message ListCommitsResponse {
  // Newest first.
  repeated Commit commits = 1;
}

message Commit {
  string hash = 1;
  string short = 2;
  string subject = 3;
  int64 unix_seconds = 4;
  // Lines added and removed in the folder.
  int32 added = 5;
  int32 removed = 6;
}

message EventsRequest {}

message EventsResponse {
  string chat_id = 1;
  // Numbers the chat's events from 1 (see GetChatResponse.seq).
  int64 seq = 6;
  oneof kind {
    ItemEvent item = 2;
    ChatStatus status = 3;
    ChatConfig config = 4;
    // The chat was opened, or its title, mode or archived state changed.
    Chat chat = 5;
    // The agent's slash commands, all of them.
    ChatCommands commands = 7;
    // The chat was deleted (DeleteChat).
    bool removed = 8;
    // The chat's usage, all of it.
    Usage usage = 9;
    // The messages waiting for the agent, all of them.
    ChatQueue queue = 10;
    // The transcript was cut back: this item and every one after it are
    // gone.
    string cut = 11;
    // The chat's terminals, all of them, in order; these events have no
    // seq.
    ChatTerminals terminals = 12;
    // This item is gone (a message the agent never got); the rest stay.
    string dropped = 13;
    // Remote access changed (chat_id is empty).
    Remote remote = 14;
    // The chats removed because their agent no longer has their sessions,
    // all of them (ListChatsResponse.removed); chat_id is empty.
    RemovedChats removed_chats = 15;
    // What the check for a newer release found, when that changed
    // (chat_id is empty; API 86).
    UpdateCheck update = 16;
  }
}

// A chat's config options, all of them.
message ChatConfig {
  repeated ConfigOption options = 1;
}

// One of the agent's session settings.
message ConfigOption {
  string id = 1;
  string name = 2;
  string description = 3;
  // ACP's category: mode, model, model_config, thought_level, or another.
  string category = 4;
  // "select" or "boolean".
  string type = 5;
  // The current value; "true" or "false" for a boolean.
  string current = 6;
  repeated ConfigValue values = 7;
}

message ConfigValue {
  string value = 1;
  string name = 2;
  string description = 3;
  // The value's group, if the agent groups them.
  string group = 4;
  // The agent's "use the default" choice (Claude's "Default (recommended)"
  // model), rather than one value of its own.
  bool is_default = 5;
}

enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  ITEM_KIND_USER_MESSAGE = 1;
  ITEM_KIND_AGENT_MESSAGE = 2;
  ITEM_KIND_TOOL_CALL = 3;
  // The agent asks to run a tool call. Status is "pending" until it is
  // answered ("answered") or the agent stops waiting ("cancelled").
  ITEM_KIND_PERMISSION = 4;
  // A form the agent asks the user to fill in (Claude's AskUserQuestion);
  // text is its message. Status is "pending" until it is "answered",
  // "declined" or "cancelled".
  ITEM_KIND_QUESTION = 5;
  // The agent's thinking, streamed like a message.
  ITEM_KIND_THOUGHT = 6;
  // The agent's plan as a checklist (plan), replaced as it changes.
  ITEM_KIND_PLAN = 7;
  // How a turn ended when it didn't end normally, or an error: status is
  // "cancelled", "refusal", "max_tokens", "max_turn_requests" or "error",
  // and text says it in words. A reopen that failed has one notice, which
  // goes once the chat runs again: "not_ready" (its agent isn't set up or
  // installed: Settings › Agents), "folder_gone" (MoveChat),
  // "session_gone" (its agent no longer has the session, and the chat is
  // kept only for its worktree's or scratch folder's work: DeleteChat), or
  // "reopen_failed" (ReopenChat tries again). "own_turn" marks where the
  // agent starts working on its own, outside a turn of the user's (after a
  // background task ended). "branch_renamed" says Nushi named the chat's
  // branch after it, between turns (the agent isn't told);
  // "branch_switched" that the chat's folder was switched to another
  // branch (SwitchBranch).
  ITEM_KIND_NOTICE = 8;
}

// One entry of a chat's transcript.
message Item {
  string id = 1;
  ItemKind kind = 2;
  // The message, or a tool call's output as markdown (its diffs apart).
  string text = 3;
  // A tool call's title, kind and status, as ACP names them ("execute",
  // "completed", ...).
  string title = 4;
  string tool_kind = 5;
  string status = 6;
  // A permission prompt's choices, and the id of the one picked.
  repeated Option options = 7;
  string answer = 8;
  // A question's form, in the agent's order.
  repeated Field fields = 9;
  // The files a tool call works on, relative to the chat's folder when
  // inside it, and the edits it makes (path, old_text, new_text).
  repeated string paths = 10;
  repeated FileChange diffs = 11;
  repeated PlanEntry plan = 12;
  // A message's or a tool call's images.
  repeated ImageData images = 13;
  // The tool call whose subagent made this item, if one did.
  string parent = 14;
  // For a tool call that starts a subagent, the subagent's type ("Explore").
  string agent = 15;
  // A tool call's tool, when the agent names it (Claude's "Read",
  // "SubagentHandback", ...).
  string tool = 16;
  // For a user message: the agent's message the conversation before it
  // ends with, where a rewind to it forks the session.
  string fork_at = 17;
  // For a user message: the chat can be rewound to just before it while
  // status.can_rewind and the chat is idle.
  bool rewindable = 18;
  // For a tool call that starts a subagent: how the subagent goes.
  Subagent subagent = 19;
  // The tool call is a subagent's report to the chat (Claude's
  // SubagentHandback): its subagent's result, not one of its steps.
  bool report = 20;
  // For a tool call that starts a subagent: the task it was given, the
  // model and effort it was asked to use (the config option values, "" when
  // it uses the chat's), and the model it ran on (a name to show), once the
  // agent says.
  string prompt = 21;
  string model = 22;
  string effort = 23;
  string ran_model = 24;
  // For a tool call that left its command running in the background.
  Shell shell = 25;
  // For a tool call that starts a subagent: the agent's id for it, when the
  // agent can pass it messages (SendPromptRequest.to_subagent).
  string agent_id = 26;
  // For a user message: the type of the subagent the agent was asked to
  // pass it to, and that subagent's tool call (not known after a replay
  // the agent's own call doesn't link).
  string relay_to = 27;
  string relay_call = 28;
  // How the relay went: "sending" until the agent passes it on (its call
  // that does is relayed_by), "relayed" once that call completes, "failed"
  // when it fails or the turn ends without one; "" when unknown (replayed).
  string relay_state = 29;
  string relayed_by = 30;
  // For a tool call that reports a code review's result (Claude's
  // ReportFindings): what it found.
  Findings findings = 31;
  // For a user message: it asked the agent to stop that subagent, or the
  // background command relay_to names (StopTask), not to pass anything on.
  bool relay_stop = 32;
  // For a user message sent through Nushi: when, in Unix milliseconds; 0
  // when not known (one the agent replayed). API 78.
  int64 sent = 33;
  // A tool call's input as the agent gave it, as indented JSON, and its
  // result as the agent gave it (text or indented JSON), only while its
  // text, diffs and images show nothing; each cut to about 8 KB. API 79.
  string input = 34;
  string raw_output = 35;
}

// A code review's result: the effort level it ran at ("medium"; "" when
// not said) and its findings, most severe first.
message Findings {
  string level = 1;
  repeated Finding items = 2;
}

// One thing a review found. file is relative to the repository (or
// absolute), line from 1 (0: not given); short_summary (up to 60
// characters), category ("correctness"), verdict ("CONFIRMED",
// "PLAUSIBLE") and outcome after fixes ("fixed", "skipped",
// "no_change_needed") may be empty. All of it is the agent's text.
message Finding {
  string file = 1;
  int32 line = 2;
  string summary = 3;
  string short_summary = 4;
  string failure_scenario = 5;
  string category = 6;
  string verdict = 7;
  string outcome = 8;
}

// A command the agent runs in the background.
message Shell {
  // The agent's id for it.
  string id = 1;
  // "running" while the daemon sees it run, then "done", "failed" or
  // "stopped"; "started" when its end can't be known.
  string state = 2;
  // When the daemon saw it start, and end, in Unix milliseconds; 0 when it
  // didn't.
  int64 started = 3;
  int64 ended = 4;
  // What it wrote so far (the end of it), and how it ended, in the agent's
  // words ("exited with code 0").
  string output = 5;
  string end = 6;
}

// How a subagent goes.
message Subagent {
  // "running", "done", "failed", or "stopped" (by the agent, StopTask, or
  // with its agent).
  string state = 1;
  // When the daemon saw it start, and end, in Unix milliseconds; 0 when it
  // didn't (a replayed chat).
  int64 started = 2;
  int64 ended = 3;
  // What it found, once it has ended: its report, its call's output, or
  // its last message.
  string result = 4;
  // The agent's session for it, when the agent shows it as one (ACP's
  // subagents): StopTask stops it there.
  string session = 5;
}

// A step of the agent's plan; status is "pending", "in_progress" or
// "completed".
message PlanEntry {
  string content = 1;
  string status = 2;
}

// A choice the agent offers.
message Option {
  string id = 1;
  string name = 2;
  // For a permission option, ACP's hint: allow_once, allow_always,
  // reject_once or reject_always.
  string kind = 3;
  string description = 4;
}

enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_TEXT = 1;
  // One of the options.
  FIELD_TYPE_CHOICE = 2;
  // Any of the options.
  FIELD_TYPE_CHOICES = 3;
  FIELD_TYPE_NUMBER = 4;
  FIELD_TYPE_INTEGER = 5;
  FIELD_TYPE_BOOLEAN = 6;
}

// One entry of a question's form.
message Field {
  string id = 1;
  string title = 2;
  string description = 3;
  FieldType type = 4;
  repeated Option options = 5;
  bool required = 6;
  // The answer, once given: one value, or several for CHOICES.
  repeated string values = 7;
  // For a free-text field that is another field's "Other" answer: that
  // field's id.
  string other_for = 8;
}

message ItemEvent {
  Item item = 1;
  // The item's text continues with item.text rather than being replaced.
  bool append = 2;
  // Where the item is in the chat, from 0 (not with append): a client that
  // has only the recent part (GetChatRequest.recent) leaves out what is
  // before it.
  int32 index = 3;
}

message ChatStatus {
  bool busy = 1;
  reserved 2;
  reserved "error";
  // When the running turn started, in Unix milliseconds; 0 when idle.
  int64 started = 3;
  // The agent waits on the user: a permission prompt or a question.
  bool waiting = 4;
  // The agent can fork the chat (ForkChat).
  bool can_fork = 5;
  // The agent takes images in prompts.
  bool images = 6;
  // The agent can rewind the chat to a user message (RewindChat).
  bool can_rewind = 7;
  // MCP servers changed since the agent started; ReloadChat picks them up
  //.
  bool mcp_changed = 8;
  // GetContextUsage can ask the agent what fills its context, once the
  // chat is idle.
  bool can_ask_context = 9;
  // No agent runs for the chat: it sleeps (SleepChat), or wasn't opened
  // since the daemon started. Never said of an archived chat.
  bool asleep = 10;
  // SleepChat can put it to sleep: its agent runs and can reopen the
  // session.
  bool can_sleep = 11;
  // No agent runs for the chat because its last reopen failed (a notice
  // says why); it isn't asleep. ReopenChat tries again; an agent that
  // becomes ready clears it where it wasn't (the next ReopenChat reopens).
  bool reopen_failed = 12;
  // Of a chat whose reopen failed: its agent no longer has its session
  // (it deleted it). The chat stays only for its worktree's or scratch
  // folder's work; DeleteChat is what's left.
  bool session_gone = 13;
  // How many subagents and background commands the chat's agent started
  // still run (API 84): a turn can end while they do.
  int32 background = 14;
}

// A shell the user runs beside a chat, in the daemon.
message Terminal {
  string id = 1;
  string chat_id = 2;
  // Where it started.
  string folder = 3;
  // The shell's name, such as "zsh".
  string shell = 5;
  // The foreground program's command line while it isn't the shell.
  string program = 6;
  bool exited = 7;
  // -1: killed by a signal.
  int32 exit_code = 8;
  // The name the user gave it, if any.
  string name = 9;
}

message ChatTerminals {
  repeated Terminal terminals = 1;
}

message OpenTerminalRequest {
  string chat_id = 1;
  // Empty: the chat's folder.
  string folder = 2;
  int32 cols = 3;
  int32 rows = 4;
}

message OpenTerminalResponse {
  Terminal terminal = 1;
}

message ListTerminalsRequest {
  string chat_id = 1;
}

message ListTerminalsResponse {
  repeated Terminal terminals = 1;
}

message AttachTerminalRequest {
  string terminal_id = 1;
}

message AttachTerminalResponse {
  bytes data = 1;
  // The shell has exited; this is the last message.
  bool exited = 2;
  int32 exit_code = 3;
}

message WriteTerminalRequest {
  string terminal_id = 1;
  bytes data = 2;
}

message WriteTerminalResponse {}

message ResizeTerminalRequest {
  string terminal_id = 1;
  int32 cols = 2;
  int32 rows = 3;
}

message ResizeTerminalResponse {}

message RenameTerminalRequest {
  string terminal_id = 1;
  string name = 2;
}

message RenameTerminalResponse {}

message ArrangeTerminalsRequest {
  string chat_id = 1;
  repeated string terminal_ids = 2;
}

message ArrangeTerminalsResponse {}

message RestartTerminalRequest {
  string terminal_id = 1;
  int32 cols = 2;
  int32 rows = 3;
}

