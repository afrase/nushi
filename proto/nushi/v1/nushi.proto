// A Jira site Nushi has a token for; id is its host.
message JiraSite {
  string id = 1;
  string url = 2;
  string email = 3;
  // Who the token is.
  string name = 4;
  string account_id = 5;
  bool scoped = 6;
  // When the token expires, if the user said (ms; 0: not known).
  int64 expires = 7;
  int64 board = 8;
  string board_name = 9;
  repeated JiraSearch searches = 10;
  // Why Nushi can't use it now, if it can't; needs_ok: the keychain wants
  // the user's OK (AllowJiraToken).
  string problem = 11;
  bool needs_ok = 12;
}

message JiraSearch {
  string name = 1;
  string jql = 2;
}

message JiraIssueRef {
  string key = 1;
  string summary = 2;
  string type = 3;
  string status = 4;
  // "new", "indeterminate" or "done".
  string status_category = 5;
}

// An issue; a list fills only key to updated. Text is Markdown.
message JiraIssue {
  string key = 1;
  string summary = 2;
  string type = 3;
  string status = 4;
  string status_category = 5;
  string priority = 6;
  string assignee = 7;
  int64 updated = 8;
  string reporter = 9;
  int64 created = 10;
  repeated string labels = 11;
  string description = 12;
  string acceptance_criteria = 13;
  JiraIssueRef parent = 14;
  repeated JiraIssueRef subtasks = 15;
  repeated JiraLink links = 16;
  repeated JiraAttachment attachments = 17;
  repeated JiraComment comments = 18;
  repeated JiraRemoteLink remote_links = 19;
  // The issue in the browser.
  string url = 20;
}

message JiraLink {
  // As this issue reads it: "blocks", "is blocked by".
  string relation = 1;
  JiraIssueRef issue = 2;
}

message JiraAttachment {
  string id = 1;
  string name = 2;
  string mime_type = 3;
  int64 size = 4;
}

message JiraComment {
  string id = 1;
  string author = 2;
  string body = 3;
  int64 created = 4;
  int64 updated = 5;
}

message JiraRemoteLink {
  string title = 1;
  string url = 2;
}

message JiraTransition {
  string id = 1;
  string name = 2;
  string to = 3;
  string to_category = 4;
  repeated JiraField fields = 5;
}

// A field a transition's screen asks for. type: "string", "text"
// (Markdown), "number", "user" (an account id), "option" and the like (an
// option's id), "array:<items>".
message JiraField {
  string id = 1;
  string name = 2;
  string type = 3;
  bool required = 4;
  repeated JiraOption options = 5;
}

message JiraOption {
  string id = 1;
  string name = 2;
}

message JiraBoard {
  int64 id = 1;
  string name = 2;
  string project = 3;
}

message ListJiraSitesRequest {}

message ListJiraSitesResponse {
  repeated JiraSite sites = 1;
}

message AddJiraSiteRequest {
  string url = 1;
  string email = 2;
  string token = 3;
  // When the token expires, if known (ms).
  int64 expires = 4;
}

message AddJiraSiteResponse {
  JiraSite site = 1;
}

message RemoveJiraSiteRequest {
  string site = 1;
}

message RemoveJiraSiteResponse {}

message CheckJiraSiteRequest {
  string site = 1;
}

message CheckJiraSiteResponse {
  string name = 1;
}

message AllowJiraTokenRequest {
  string site = 1;
}

message AllowJiraTokenResponse {}

message ListJiraBoardsRequest {
  string site = 1;
}

message ListJiraBoardsResponse {
  repeated JiraBoard boards = 1;
}

message SetJiraBoardRequest {
  string site = 1;
  JiraBoard board = 2;
}

message SetJiraBoardResponse {}

message SetJiraSearchesRequest {
  string site = 1;
  repeated JiraSearch searches = 2;
}

message SetJiraSearchesResponse {}

message ListJiraIssuesRequest {
  string site = 1;
  // "mine", "sprint", or "" for jql.
  string list = 2;
  string jql = 3;
}

message ListJiraIssuesResponse {
  repeated JiraIssue issues = 1;
  // The sprint list's sprint ("" when the board has none active).
  string sprint = 2;
}

message GetJiraJqlRequest {
  string site = 1;
}

message GetJiraJqlResponse {
  repeated JiraJqlField fields = 1;
  repeated string functions = 2;
  repeated string words = 3;
}

message JiraJqlField {
  string name = 1;
  string display = 2;
  repeated string operators = 3;
}

message SuggestJiraJqlRequest {
  string site = 1;
  string field_name = 2;
  string prefix = 3;
}

message SuggestJiraJqlResponse {
  // id: the value as JQL takes it; name: how it reads.
  repeated JiraOption values = 1;
}

message GetJiraIssueRequest {
  string site = 1;
  string key = 2;
}

message GetJiraIssueResponse {
  JiraIssue issue = 1;
  // What agents wrote to it through their tools, the latest last.
  repeated JiraWrite agent_writes = 2;
}

// A write an agent made to an issue through its tools (ADR 0043).
message JiraWrite {
  // "comment" (comment: its id) or "move" (to: the status).
  string kind = 1;
  string comment = 2;
  string to = 3;
  // The chat and its agent.
  string chat = 4;
  string agent = 5;
  int64 at = 6;
}

message ListJiraTransitionsRequest {
  string site = 1;
  string key = 2;
}

message ListJiraTransitionsResponse {
  repeated JiraTransition transitions = 1;
}

message TransitionJiraIssueRequest {
  string site = 1;
  string key = 2;
  string transition = 3;
  // By field id.
  map<string, string> values = 4;
}

message TransitionJiraIssueResponse {}

message AddJiraCommentRequest {
  string site = 1;
  string key = 2;
  string markdown = 3;
}

message AddJiraCommentResponse {
  JiraComment comment = 1;
}

message GetJiraAttachmentRequest {
  string site = 1;
  string id = 2;
  bool thumbnail = 3;
}

message GetJiraAttachmentResponse {
  bytes data = 1;
  string mime_type = 2;
}

message FindJiraIssuesRequest {
  // An issue's link (https://<site>/browse/KEY, a board's ?selectedIssue=),
  // its key, or words of it; empty for the issues looked at last.
  string text = 1;
  // The site a key is on (the one used last); empty for the first.
  string site = 2;
}

message FindJiraIssuesResponse {
  // A link matching several sites has one issue from each.
  repeated FoundJiraIssue issues = 1;
  // A link to a site that isn't added: its address.
  string unknown_site = 2;
}

message FoundJiraIssue {
  string site = 1;
  // Key, summary, type, status.
  JiraIssue issue = 2;
  // KEY-summary-slug, the key uppercase so Jira links it.
  string branch = 3;
}

// What's left of one of GitHub's rate limits ("core", "graphql",
// "search"…), as GitHub said last.
message GitHubBucket {
  string name = 1;
  int32 limit = 2;
  int32 remaining = 3;
  int64 reset_ms = 4;
}

message GitHubHost {
  // github.com, or an Enterprise server's host.
  string host = 1;
  // Who its token is.
  string login = 2;
  string name = 3;
  // Where its token is from: "gh" (gh's login), "GH_TOKEN" (the
  // environment, through gh's rules), "token" (pasted).
  string source = 4;
  // "oauth" (gh's), "classic", "fine-grained", "app", or "".
  string kind = 5;
  // A classic or OAuth token's scopes.
  repeated string scopes = 6;
  repeated GitHubBucket budget = 7;
  // Why Nushi can't use it now, if it can't.
  string problem = 8;
  // Its pasted token needs the user's OK for this build (AllowGitHubToken).
  bool needs_ok = 9;
  // A pasted token is kept for it (RemoveGitHubToken).
  bool pasted = 10;
}

message ListGitHubHostsRequest {}

message ListGitHubHostsResponse {
  repeated GitHubHost hosts = 1;
}

message AddGitHubTokenRequest {
  string host = 1;
  string token = 2;
}

message AddGitHubTokenResponse {
  string login = 1;
}

message RemoveGitHubTokenRequest {
  string host = 1;
}

message RemoveGitHubTokenResponse {}

message AllowGitHubTokenRequest {
  string host = 1;
}

message AllowGitHubTokenResponse {}

message GitHubRepo {
  string host = 1;
  // owner/name.
  string repo = 2;
  repeated string folders = 3;
}

message ListGitHubReposRequest {
  repeated string folders = 1;
}

message ListGitHubReposResponse {
  repeated GitHubRepo repos = 1;
}

// A pull request or an issue: its host, repository and number.
message GitHubRef {
  string host = 1;
  string repo = 2;
  int32 number = 3;
}

// A pull request or an issue as a list shows it.
message GitHubItem {
  GitHubRef ref = 1;
  // GitHub's node id.
  string id = 2;
  bool pull = 3;
  string title = 4;
  string url = 5;
  // "open", "closed" or "merged".
  string state = 6;
  bool draft = 7;
  string author = 8;
  int64 updated_ms = 9;
  // A pull request's checks: "success", "failure", "pending", or "".
  string checks = 10;
  // Its review decision: "approved", "changes_requested",
  // "review_required", or "".
  string review = 11;
  // Its review threads not resolved.
  int32 unresolved = 12;
  int32 comments = 13;
}

message ListGitHubInboxRequest {
  string host = 1;
  // Only these repositories' (owner/name); empty for all.
  repeated string repos = 2;
  // The app's timer asking: held back while a rate limit is low.
  bool quiet = 3;
}

message ListGitHubInboxResponse {
  repeated GitHubItem review = 1;
  repeated GitHubItem mine = 2;
  repeated GitHubItem assigned = 3;
  // How many each search found (50 are listed at most).
  int32 review_total = 4;
  int32 mine_total = 5;
  int32 assigned_total = 6;
  // When GitHub said so; with stale, why it couldn't say again.
  int64 at_ms = 7;
  string stale = 8;
}

// A pull request or an issue a chat is on: its host and node id, and its
// repository and number.
message GitHubLink {
  string host = 1;
  string id = 2;
  string repo = 3;
  int32 number = 4;
  bool pull = 5;
}

message GetGitHubStatesRequest {
  repeated GitHubLink items = 1;
  bool quiet = 2;
}

message GetGitHubStatesResponse {
  // The ones known, as they are now (or last were).
  repeated GitHubItem items = 1;
}

// A comment, or a review that said something; body is Markdown as
// GitHub's page shows it.
message GitHubComment {
  string id = 1;
  string author = 2;
  // GitHub's author association: OWNER, MEMBER, COLLABORATOR,
  // CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, NONE…
  string association = 3;
  // The author isn't the repository's owner, a member or a collaborator.
  bool outside = 4;
  bool bot = 5;
  string body = 6;
  string url = 7;
  int64 created_ms = 8;
  // A review's state ("approved", "changes_requested", "commented",
  // "dismissed"); empty for a comment.
  string review = 9;
}

// A review thread on line (from start_line) of path's side ("left", the
// base; "right", the head), or on the file. An outdated one's lines are
// the original ones.
message GitHubThread {
  string id = 1;
  string path = 2;
  string side = 3;
  int32 line = 4;
  int32 start_line = 5;
  int32 original_line = 6;
  int32 original_start_line = 7;
  bool on_file = 8;
  bool outdated = 9;
  bool resolved = 10;
  bool can_reply = 11;
  bool can_resolve = 12;
  bool can_unresolve = 13;
  repeated GitHubComment comments = 14;
}

message GitHubAnnotation {
  string path = 1;
  // "failure", "warning", "notice".
  string level = 2;
  string title = 3;
  string message = 4;
  int32 line = 5;
  int32 end_line = 6;
}

// A check run (id is its id, an Actions job's) or a commit status (id 0).
message GitHubCheck {
  int64 id = 1;
  string name = 2;
  string workflow = 3;
  string app = 4;
  // "pending" until it ends, then its conclusion: "success", "failure",
  // "cancelled", "skipped", "neutral", "timed_out"…
  string state = 5;
  bool failed = 6;
  string url = 7;
  string title = 8;
  // Markdown as GitHub's page shows it.
  string summary = 9;
  bool required = 10;
  repeated GitHubAnnotation annotations = 11;
  int64 started_ms = 12;
  int64 completed_ms = 13;
}

// Someone asked to review ("requested"), or who did ("approved",
// "changes_requested", "commented", "dismissed"); a team asked has team.
message GitHubReviewer {
  string login = 1;
  string state = 2;
  bool team = 3;
}

message GitHubPull {
  GitHubItem item = 1;
  string body = 2;
  string association = 3;
  bool outside = 4;
  string base = 5;
  string head = 6;
  // The head's repository (owner/name): another one for a fork's.
  string head_repo = 7;
  bool cross_repo = 8;
  string base_oid = 9;
  string head_oid = 10;
  // "mergeable", "conflicting", "unknown".
  string mergeable = 11;
  // "clean", "blocked", "behind", "dirty", "unstable", "has_hooks",
  // "unknown".
  string merge_state = 12;
  int32 additions = 13;
  int32 deletions = 14;
  int32 changed_files = 15;
  repeated GitHubReviewer reviewers = 16;
  // Comments and reviews that said something, oldest first.
  repeated GitHubComment conversation = 17;
  repeated GitHubThread threads = 18;
  repeated GitHubCheck checks = 19;
  // My review pending on GitHub (made in the browser), which a review
  // submitted here joins, and its comments' count.
  string pending_review = 20;
  int32 pending_comments = 21;
}

message GetGitHubPullRequest {
  GitHubRef ref = 1;
  bool quiet = 2;
}

message GetGitHubPullResponse {
  GitHubPull pull = 1;
}

message GitHubIssue {
  GitHubItem item = 1;
  string body = 2;
  string association = 3;
  bool outside = 4;
  repeated string labels = 5;
  repeated string assignees = 6;
  repeated GitHubComment conversation = 7;
}

message GetGitHubIssueRequest {
  GitHubRef ref = 1;
  bool quiet = 2;
}

message GetGitHubIssueResponse {
  GitHubIssue issue = 1;
}

message GetGitHubFilesRequest {
  GitHubRef ref = 1;
  // The pull request's base and head commits (GitHubPull's).
  string base_oid = 2;
  string head_oid = 3;
}

message GetGitHubFilesResponse {
  repeated FileChange files = 1;
}

message GetGitHubJobLogRequest {
  GitHubRef ref = 1;
  // The check run's id.
  int64 job = 2;
}

message GetGitHubJobLogResponse {
  string tail = 1;
}

message ReplyGitHubThreadRequest {
  string host = 1;
  string thread = 2;
  string body = 3;
}

message ReplyGitHubThreadResponse {
  GitHubComment comment = 1;
}

message ResolveGitHubThreadRequest {
  string host = 1;
  string thread = 2;
  // False unresolves it.
  bool resolve = 3;
}

message ResolveGitHubThreadResponse {}

message AddGitHubCommentRequest {
  string host = 1;
  // The pull request's or issue's node id.
  string subject = 2;
  string body = 3;
}

message AddGitHubCommentResponse {
  GitHubComment comment = 1;
}

// A comment of a review not yet sent, on line (from start_line, if more
// than one) of path's side ("left" or "right").
message GitHubDraft {
  string path = 1;
  string side = 2;
  int32 line = 3;
  int32 start_line = 4;
  string body = 5;
}

message SubmitGitHubReviewRequest {
  string host = 1;
  // The pull request's node id, and the head the drafts are on.
  string pull = 2;
  string head_oid = 3;
  // My review pending on GitHub, if there is one (GitHubPull's).
  string pending_review = 4;
  // "comment", "approve" or "request_changes".
  string event = 5;
  string body = 6;
  repeated GitHubDraft drafts = 7;
}

message SubmitGitHubReviewResponse {}

message GetGitHubPromptRequest {
  GitHubRef ref = 1;
  // "fix_checks" or "address_comments".
  string kind = 2;
  // The threads to address (GitHubThread.id); empty for all not resolved.
  repeated string threads = 3;
}

message GetGitHubPromptResponse {
  string text = 1;
}
