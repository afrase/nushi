syntax = "proto3";

package nushi.v1;

option go_package = "github.com/afrase/nushi/internal/gen/nushi/v1;nushiv1";

service NushiService {
  rpc Ping(PingRequest) returns (PingResponse);
  // Lists every stored chat.
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  // Returns everything a chat's events have built so far, to pick it up
  // after (re)connecting.
  rpc GetChat(GetChatRequest) returns (GetChatResponse);
  // Starts an agent in a folder and opens a chat with it.
  rpc StartChat(StartChatRequest) returns (StartChatResponse);
  // Sends a prompt; the reply arrives as events.
  rpc SendPrompt(SendPromptRequest) returns (SendPromptResponse);
  // Answers a pending permission prompt with one of its options.
  rpc AnswerPermission(AnswerPermissionRequest) returns (AnswerPermissionResponse);
  // Answers a pending question, or declines it.
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  // Sets one of a chat's config options (mode, model, ...). Picking a mode
  // makes new chats with the same agent start in it.
  rpc SetConfigOption(SetConfigOptionRequest) returns (SetConfigOptionResponse);
  // Returns a folder's uncommitted changes against HEAD, untracked files
  // included.
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse);
  // Streams every change to every chat from now on. The first message is
  // empty: it says the subscription is live.
  rpc Events(EventsRequest) returns (stream EventsResponse);
}

message PingRequest {}

message PingResponse {
  // Bumped when methods are added; the API only grows (ADR 0004).
  int32 api_version = 1;
}

message ListChatsRequest {}

message ListChatsResponse {
  repeated Chat chats = 1;
}

// What Nushi keeps of a chat; the agent keeps the rest.
message Chat {
  // The agent's session id.
  string id = 1;
  string agent = 2;
  string folder = 3;
  string title = 4;
  // The mode it was last in.
  string mode = 5;
  int64 created_unix_ms = 6;
}

message GetChatRequest {
  string chat_id = 1;
}

message GetChatResponse {
  Chat chat = 1;
  repeated Item items = 2;
  repeated ConfigOption config = 3;
  ChatStatus status = 4;
  // The last event this includes: apply only the chat's events after it.
  int64 seq = 5;
}

message StartChatRequest {
  string folder = 1;
}

message StartChatResponse {
  string chat_id = 1;
  // The chat's config options as it starts; changes arrive as events.
  repeated ConfigOption config = 2;
}

message SendPromptRequest {
  string chat_id = 1;
  string text = 2;
}

message SendPromptResponse {}

message AnswerPermissionRequest {
  string chat_id = 1;
  string item_id = 2;
  string option_id = 3;
}

message AnswerPermissionResponse {}

message AnswerQuestionRequest {
  string chat_id = 1;
  string item_id = 2;
  // The answer by field; fields left out are unanswered.
  repeated FieldAnswer answers = 3;
  // Decline the question instead of answering it.
  bool decline = 4;
}

message FieldAnswer {
  string field_id = 1;
  repeated string values = 2;
}

message AnswerQuestionResponse {}

message SetConfigOptionRequest {
  string chat_id = 1;
  string config_id = 2;
  // A select option's value, or "true"/"false" for a boolean.
  string value = 3;
}

message SetConfigOptionResponse {}

message GetDiffRequest {
  // An absolute path; it may be anywhere inside a repository.
  string folder = 1;
}

message GetDiffResponse {
  // Sorted by path.
  repeated FileChange files = 1;
}

// One file's change: its text at HEAD and now.
message FileChange {
  // Relative to the folder.
  string path = 1;
  // "added", "modified" or "deleted".
  string status = 2;
  string old_text = 3;
  string new_text = 4;
  // Why the texts are left out ("binary", "too large"), if they are.
  string skipped = 5;
}

message EventsRequest {}

message EventsResponse {
  string chat_id = 1;
  // Numbers the chat's events from 1 (see GetChatResponse.seq).
  int64 seq = 6;
  oneof kind {
    ItemEvent item = 2;
    ChatStatus status = 3;
    ChatConfig config = 4;
    // The chat was opened, or its title or mode changed.
    Chat chat = 5;
  }
}

// A chat's config options, all of them.
message ChatConfig {
  repeated ConfigOption options = 1;
}

// One of the agent's session settings.
message ConfigOption {
  string id = 1;
  string name = 2;
  string description = 3;
  // ACP's category: mode, model, model_config, thought_level, or another.
  string category = 4;
  // "select" or "boolean".
  string type = 5;
  // The current value; "true" or "false" for a boolean.
  string current = 6;
  repeated ConfigValue values = 7;
}

message ConfigValue {
  string value = 1;
  string name = 2;
  string description = 3;
  // The value's group, if the agent groups them.
  string group = 4;
}

enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  ITEM_KIND_USER_MESSAGE = 1;
  ITEM_KIND_AGENT_MESSAGE = 2;
  ITEM_KIND_TOOL_CALL = 3;
  // The agent asks to run a tool call. Status is "pending" until it is
  // answered ("answered") or the agent stops waiting ("cancelled").
  ITEM_KIND_PERMISSION = 4;
  // A form the agent asks the user to fill in (Claude's AskUserQuestion);
  // text is its message. Status is "pending" until it is "answered",
  // "declined" or "cancelled".
  ITEM_KIND_QUESTION = 5;
}

// One entry of a chat's transcript.
message Item {
  string id = 1;
  ItemKind kind = 2;
  // The message, or a tool call's output as markdown (its diffs apart).
  string text = 3;
  // A tool call's title, kind and status, as ACP names them ("execute",
  // "completed", ...).
  string title = 4;
  string tool_kind = 5;
  string status = 6;
  // A permission prompt's choices, and the id of the one picked.
  repeated Option options = 7;
  string answer = 8;
  // A question's form, in the agent's order.
  repeated Field fields = 9;
  // The files a tool call works on, relative to the chat's folder when
  // inside it, and the edits it makes (path, old_text, new_text).
  repeated string paths = 10;
  repeated FileChange diffs = 11;
}

// A choice the agent offers.
message Option {
  string id = 1;
  string name = 2;
  // For a permission option, ACP's hint: allow_once, allow_always,
  // reject_once or reject_always.
  string kind = 3;
  string description = 4;
}

enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_TEXT = 1;
  // One of the options.
  FIELD_TYPE_CHOICE = 2;
  // Any of the options.
  FIELD_TYPE_CHOICES = 3;
  FIELD_TYPE_NUMBER = 4;
  FIELD_TYPE_INTEGER = 5;
  FIELD_TYPE_BOOLEAN = 6;
}

// One entry of a question's form.
message Field {
  string id = 1;
  string title = 2;
  string description = 3;
  FieldType type = 4;
  repeated Option options = 5;
  bool required = 6;
  // The answer, once given: one value, or several for CHOICES.
  repeated string values = 7;
}

message ItemEvent {
  Item item = 1;
  // The item's text continues with item.text rather than being replaced.
  bool append = 2;
}

message ChatStatus {
  bool busy = 1;
  // How the last turn failed, if it did.
  string error = 2;
}
