  string id = 1;
  string name = 2;
  // Unix milliseconds; last_seen 0 when never.
  int64 paired = 3;
  int64 last_seen = 4;
  bool connected = 5;
}

message Pairing {
  // Unix milliseconds: the QR code is good until then.
  int64 expires = 1;
  // Once a phone has connected: its name, and the code both screens show.
  string name = 2;
  string code = 3;
}

