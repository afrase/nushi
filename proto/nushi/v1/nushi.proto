message LogRequest {
  // "debug", "info", "warn" or "error".
  string level = 1;
  string message = 2;
  // A Dart stack trace, for an error.
  string stack = 3;
  // More of the line, as key=value.
  map<string, string> attrs = 4;
}

message LogResponse {}

// A Jira site Nushi has a token for; id is its host.
message JiraSite {
  string id = 1;
  string url = 2;
  string email = 3;
  // Who the token is.
  string name = 4;
  string account_id = 5;
  bool scoped = 6;
  // When the token expires, if the user said (ms; 0: not known).
  int64 expires = 7;
  int64 board = 8;
  string board_name = 9;
  repeated JiraSearch searches = 10;
  // Why Nushi can't use it now, if it can't; needs_ok: the keychain wants
  // the user's OK (AllowJiraToken).
  string problem = 11;
  bool needs_ok = 12;
  // The daemon can't reach the keychain until it starts again (its build
  // was replaced or removed since it started, or it runs outside the
  // user's login session): problem says so; Allow wouldn't help.
  bool needs_restart = 13;
}

message JiraSearch {
  string name = 1;
  string jql = 2;
}

message JiraIssueRef {
  string key = 1;
  string summary = 2;
  string type = 3;
  string status = 4;
  // "new", "indeterminate" or "done".
  string status_category = 5;
}

// An issue; a list fills only key to updated. Text is Markdown.
message JiraIssue {
  string key = 1;
  string summary = 2;
  string type = 3;
  string status = 4;
  string status_category = 5;
  string priority = 6;
  string assignee = 7;
  int64 updated = 8;
  string reporter = 9;
  int64 created = 10;
  repeated string labels = 11;
  string description = 12;
  string acceptance_criteria = 13;
  JiraIssueRef parent = 14;
  repeated JiraIssueRef subtasks = 15;
  repeated JiraLink links = 16;
  repeated JiraAttachment attachments = 17;
  repeated JiraComment comments = 18;
  repeated JiraRemoteLink remote_links = 19;
  // The issue in the browser.
  string url = 20;
  // The assignee's account id ("" when unassigned; assignee is the name).
  string assignee_id = 21;
}

message JiraLink {
  // As this issue reads it: "blocks", "is blocked by".
  string relation = 1;
  JiraIssueRef issue = 2;
}

message JiraAttachment {
  string id = 1;
  string name = 2;
  string mime_type = 3;
  int64 size = 4;
}

message JiraComment {
  string id = 1;
  string author = 2;
  string body = 3;
  int64 created = 4;
  int64 updated = 5;
}

message JiraRemoteLink {
  string title = 1;
  string url = 2;
}

message JiraTransition {
  string id = 1;
  string name = 2;
  string to = 3;
  string to_category = 4;
  repeated JiraField fields = 5;
}

// A field a transition's screen asks for. type: "string", "text"
// (Markdown), "number", "user" (an account id), "option" and the like (an
// option's id), "array:<items>".
message JiraField {
  string id = 1;
  string name = 2;
  string type = 3;
  bool required = 4;
  repeated JiraOption options = 5;
}

message JiraOption {
  string id = 1;
  string name = 2;
}

message JiraBoard {
  int64 id = 1;
  string name = 2;
  string project = 3;
}

message ListJiraSitesRequest {}

message ListJiraSitesResponse {
  repeated JiraSite sites = 1;
}

