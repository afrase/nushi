syntax = "proto3";

package nushi.v1;

option go_package = "github.com/afrase/nushi/internal/gen/nushi/v1;nushiv1";

service NushiService {
  rpc Ping(PingRequest) returns (PingResponse);
  // Stops the daemon once no chat has a turn running or waiting on the
  // user, nothing is queued and no terminal runs a command; prompts are
  // refused from then on (Unavailable), to be sent again to the new one.
  // The Mac's app asks while it bundles a newer daemon than the one
  // running, again every few seconds (an ask lapses after 15 s, so an app
  // that quit leaves the daemon running), and starts the new one once
  // this one has gone. Not on a device's channel. API 77.
  rpc RestartWhenIdle(RestartWhenIdleRequest) returns (RestartWhenIdleResponse);
  // Asks GitHub for Nushi's latest release now, whatever the setting
  // (the daemon also asks at start and every 2 hours while
  // Settings.check_updates is on), and says what it found. Not on a
  // device's channel. API 86.
  rpc CheckForUpdates(CheckForUpdatesRequest) returns (CheckForUpdatesResponse);
  // Lists every stored chat.
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  // Returns everything a chat's events have built so far, to pick it up
  // after (re)connecting.
  rpc GetChat(GetChatRequest) returns (GetChatResponse);
  // A chat's items before one of them, a page at a time: for a client that
  // took only the recent part (GetChatRequest.recent), as it scrolls up.
  rpc GetChatItems(GetChatItemsRequest) returns (GetChatItemsResponse);
  // Starts an agent in a folder and opens a chat with it.
  rpc StartChat(StartChatRequest) returns (StartChatResponse);
  // Lists the agents chats can run, the default first, each as found on
  // this Mac now: its CLI on the login shell's PATH and its version. Each
  // CLI is only asked what it is, with file writes and the network denied.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // Sets up an agent's adapter (Agent.adapter): installs it into Nushi's
  // data folder from the lockfile Nushi pins, or updates it to the pinned
  // version. The agent's awake chats sleep just before the new one
  // replaces the old. Returns once it's done (5 minutes at most).
  rpc SetUpAgent(SetUpAgentRequest) returns (SetUpAgentResponse);
  // Removes an agent's adapter; its awake chats sleep first.
  rpc RemoveAgent(RemoveAgentRequest) returns (RemoveAgentResponse);
  // Lists an agent's sessions in a folder that aren't chats (started in a
  // terminal, say), newest first, a page at a time. It starts the agent to
  // ask (ACP session/list).
  rpc ListAgentSessions(ListAgentSessionsRequest) returns (ListAgentSessionsResponse);
  // Opens one of them as a chat in the folder: the agent replays it
  // (session/load); nothing is copied. For a session that is a chat
  // already, that chat.
  rpc OpenAgentSession(OpenAgentSessionRequest) returns (OpenAgentSessionResponse);
  // Moves a chat to another folder, or to a new worktree. A chat without
  // messages starts a new session there (and a worktree it leaves is
  // removed if it holds no work); one with messages keeps its history, in a
  // fork of its session there. Refused while the chat is busy. If the move
  // fails the chat stays where it was, with a notice saying why.
  rpc MoveChat(MoveChatRequest) returns (MoveChatResponse);
  // Sends a prompt; the reply arrives as events.
  rpc SendPrompt(SendPromptRequest) returns (SendPromptResponse);
  // Cuts a chat back to just before one of its user messages (when
  // status.can_rewind and the message's fork_at is set, or it is the first)
  // and returns that message. The agent's session is forked there: a new
  // session id, the same chat. Files aren't rewound. Refused while the chat
  // is busy.
  rpc RewindChat(RewindChatRequest) returns (RewindChatResponse);
  // Takes a message out of the chat's queue before the agent gets it, and
  // returns it. Refused once the agent has it.
  rpc Unqueue(UnqueueRequest) returns (UnqueueResponse);
  // Stops the chat's running turn (ACP session/cancel). The turn ends with a
  // "cancelled" notice, and prompts it was waiting on are cancelled. It can
  // take the last message back too (take_back).
  rpc CancelTurn(CancelTurnRequest) returns (CancelTurnResponse);
  // Stops a subagent or a background command (the tool call that started
  // it), alone: through its own session when the agent shows the subagent
  // as one (Subagent.session), else by asking the agent, as a message of
  // the user's (Item.relay_stop) that waits for its next chance. It shows
  // as stopped once the agent says so.
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
  // Opens a side chat: a session the agent forks from the chat's (ACP
  // session/fork, when status.can_fork). It knows the conversation so far
  // but doesn't add to it, isn't listed or stored, and ends with
  // CloseSideChat. Its items and status come as events like any chat's.
  rpc ForkChat(ForkChatRequest) returns (ForkChatResponse);
  rpc CloseSideChat(CloseSideChatRequest) returns (CloseSideChatResponse);
  // Sets the chat's title; it wins over the agent's. An empty title goes
  // back to the agent's.
  rpc RenameChat(RenameChatRequest) returns (RenameChatResponse);
  // Sets the pinned chats, in their order: each one listed is pinned at its
  // place (Chat.pin), every other unpinned. An archived chat or one not
  // known is left out; archiving unpins. A changed chat comes as an event.
  // (API 90)
  rpc PinChats(PinChatsRequest) returns (PinChatsResponse);
  // Renames the branch of a chat's worktree (git branch -m; its folder
  // stays), for good: the chat's title no longer names it. Refused during a
  // turn, for a name git doesn't take or that's taken, and when the branch
  // is on a remote or another worktree or chat has it. (API 68)
  rpc RenameBranch(RenameBranchRequest) returns (RenameBranchResponse);
  // Checks out a branch in a chat's folder (git switch), or a new one from
  // HEAD. Refused (an error) for a worktree chat and while it, or another
  // chat in the same checkout, works; answered without switching when the
  // branch is another worktree's, the folder has uncommitted changes (not
  // for a new branch), or other chats work there and with_others isn't
  // set. Each chat there gets a "branch_switched" line and is told with its
  // next prompt. (API 83)
  rpc SwitchBranch(SwitchBranchRequest) returns (SwitchBranchResponse);
  // Archives a chat: its turn is cancelled and its agent stops; it stays
  // listed, read-only. Unarchiving reopens it (ACP session/load).
  rpc ArchiveChat(ArchiveChatRequest) returns (ArchiveChatResponse);
  // Puts a chat to sleep (when status.can_sleep): its agent stops as for
  // ArchiveChat (a running turn is stopped, side chats end), and the chat
  // stays, its transcript too. A message, or anything else that needs the
  // agent, reopens the session (ACP session/load); opening it doesn't.
  rpc SleepChat(SleepChatRequest) returns (SleepChatResponse);
  // Says a chat is shown (selected, the app came to the front), or Try
  // again: a chat whose agent should run but doesn't is reopened, as
  // GetChat does, and one whose last reopen failed (status.reopen_failed)
  // tries again, once a call, unless what stopped it still holds (its
  // folder is gone, its agent isn't ready). A sleeping chat stays asleep.
  rpc ReopenChat(ReopenChatRequest) returns (ReopenChatResponse);
  // The daemon's settings, and changing them.
  // Says how much memory Nushi takes, as footprint (Activity Monitor's
  // Memory), in bytes: a few milliseconds' work.
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse);
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc SetSettings(SetSettingsRequest) returns (SetSettingsResponse);
  // Nushi's copies of chats' transcripts (ADR 0047): each one's size and
  // whose it is, largest first.
  rpc ListTranscripts(ListTranscriptsRequest) returns (ListTranscriptsResponse);
  // Deletes copies of transcripts: a chat goes on, its history from its
  // agent alone; one kept only for its copy (its agent deleted its
  // session) goes unless its work keeps it.
  rpc ClearTranscripts(ClearTranscriptsRequest) returns (ClearTranscriptsResponse);
  // Says what DeleteChat removes. The first time, the daemon starts the
  // agent to learn whether it can delete its history.
  rpc PlanDeleteChat(PlanDeleteChatRequest) returns (PlanDeleteChatResponse);
  // Deletes a chat: its turn is cancelled and its agent stops, its worktree
  // and branch go if asked, the agent deletes its history of each of the
  // chat's sessions (ACP session/delete, when it can), the chat's scratch
  // folder goes, and Nushi's record of it.
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
  // Takes chats off ListChatsResponse.removed (the app has said so).
  rpc DismissRemovedChats(DismissRemovedChatsRequest) returns (DismissRemovedChatsResponse);
  // Answers a pending permission prompt with one of its options.
  rpc AnswerPermission(AnswerPermissionRequest) returns (AnswerPermissionResponse);
  // Answers a pending question, or declines it.
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  // Sets one of a chat's config options (mode, model, ...). Picking a mode
  // makes new chats with the same agent start in it.
  rpc SetConfigOption(SetConfigOptionRequest) returns (SetConfigOptionResponse);
  // Returns a folder's uncommitted changes against HEAD, untracked files
  // included, or everything since its branch left a base, or what commits
  // changed.
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse);
  // Reads one of a folder's files as it is now, as a change that changes
  // nothing (status "unchanged", the text on both sides): a file a review
  // names that isn't among the changes. Only a regular file inside the
  // folder: no "..", no link.
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  // Reads a file of a chat's (in its folder or its worktree) and sends it
  // again each time it changes, until the call ends: the preview of what
  // the agent wrote. A path that leads outside them, through a link too,
  // is refused.
  rpc WatchChatFile(WatchChatFileRequest) returns (stream WatchChatFileResponse);
  // Says which of the paths an agent's message names are regular files
  // the chat's preview opens (WatchChatFile's rules: in its folder or
  // worktree, no link out, or one its tool calls worked on), so the app
  // links only those.
  rpc FindChatFiles(FindChatFilesRequest) returns (FindChatFilesResponse);
  // Lists a branch's commits since a base, or the last ones.
  rpc ListCommits(ListCommitsRequest) returns (ListCommitsResponse);
  // Sums up a folder's changes (as GetDiff lists them) and names its
  // branch.
  rpc GetFolderStatus(GetFolderStatusRequest) returns (GetFolderStatusResponse);
  // Lists a folder's repository's local branches, the newest commit first,
  // and its worktrees, the main one first. (API 83)
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  // Lists a folder's files (up to 20,000) for @-mentions: in a git
  // repository the ones git doesn't ignore.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // Asks the chat's agent, unseen, what fills its context (Claude's
  // /context), in a throwaway fork of its session, while the chat is idle.
  // Refused when the agent can't fork.
  rpc GetContextUsage(GetContextUsageRequest) returns (GetContextUsageResponse);
  // Lists the MCP servers the agent's config gives a folder, read from the
  // agent's own files, env and header values masked. With check_health, the
  // agent connects to each and says how that went (Claude's `claude mcp list`,
  // seconds), and servers only it knows (plugins', claude.ai connectors)
  // are added. Ante's (API 80): yours in $ANTE_HOME/settings.json, checked
  // by a throwaway `ante serve`; it has no off switch nor sign-in, so
  // SetMcpServerOn and Login are refused for it.
  rpc ListMcpServers(ListMcpServersRequest) returns (ListMcpServersResponse);
  // Add, edit and remove an MCP server in a scope ("user", "project",
  // "local"), through the agent's own CLI; the folder names the project.
  // Editing keeps the name and scope, and env and header values sent as
  // "••••" keep the values they had; if the new config is refused, the old
  // one is put back. Running chats the change reaches get
  // status.mcp_changed.
  rpc AddMcpServer(AddMcpServerRequest) returns (AddMcpServerResponse);
  rpc EditMcpServer(EditMcpServerRequest) returns (EditMcpServerResponse);
  rpc RemoveMcpServer(RemoveMcpServerRequest) returns (RemoveMcpServerResponse);
  // Turns a server on or off for the folder's project (API 65: by scope).
  // A project's .mcp.json server: on approves it, off rejects it (Claude's
  // enabledMcpjsonServers and disabledMcpjsonServers in the project's
  // .claude/settings.local.json). A user or local server: as /mcp in a
  // terminal does, which Claude records in ~/.claude.json, asked of Claude
  // (ADR 0050). Refused for a plugin's server and a claude.ai connector.
  rpc SetMcpServerOn(SetMcpServerOnRequest) returns (SetMcpServerOnResponse);
  // Signs in to a server that needs OAuth: the agent opens the browser and
  // the call returns once the sign-in is done there, or failed (a few
  // minutes at most). Logout forgets the sign-in.
  rpc LoginMcpServer(LoginMcpServerRequest) returns (LoginMcpServerResponse);
  rpc LogoutMcpServer(LogoutMcpServerRequest) returns (LogoutMcpServerResponse);
  // The skills (and plugins) an agent uses in a folder (API 66, ADR 0051;
  // every agent's from API 67, ADR 0052): read from the agent's files (and
  // Claude's `claude plugin list --json`), never run in the folder; shared
  // skills (.agents/skills) with every agent that loads each. Skills'
  // descriptions and plugins' text are their authors'.
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  // Turns a skill on or off: yours in your settings, a project's in the
  // project's local settings (skillOverrides, only that key); "builtin"
  // turns Claude's built-in skills on or off together, in your settings
  // (disableBundledSkills). A plugin's skills go with their plugin.
  rpc SetSkillOn(SetSkillOnRequest) returns (SetSkillOnResponse);
  // Turns an installed plugin on or off where Plugin.switch_scope says:
  // for you through `claude plugin enable`/`disable` (run in Claude's config
  // folder, never the project's), for the project by its enabledPlugins
  // entry in the project's local settings.
  rpc SetPluginOn(SetPluginOnRequest) returns (SetPluginOnResponse);
  // Uninstalls a plugin installed for you (`claude plugin uninstall`);
  // refused for one installed for a project.
  rpc UninstallPlugin(UninstallPluginRequest) returns (UninstallPluginResponse);
  // Moves a skill's folder (yours or the project's, as listed) to the
  // Trash.
  rpc TrashSkill(TrashSkillRequest) returns (TrashSkillResponse);
  // Gives an agent a shared skill it doesn't read by a relative link of
  // its own (Claude's .claude/skills/<name> → ../../.agents/skills/<name>):
  // only a shared skill listed for the folder; nothing replaced.
  rpc LinkSkill(LinkSkillRequest) returns (LinkSkillResponse);
  // Reopens a chat's session on a new agent (ACP session/load), which
  // replays its transcript, so it uses the MCP servers as they are now.
  // Refused while it is busy.
  rpc ReloadChat(ReloadChatRequest) returns (ReloadChatResponse);
  // Opens a terminal for a chat: the user's login shell, in the chat's
  // folder (its worktree, for a worktree chat) or in a given one. The
  // daemon owns it, so it outlives the app, but not the daemon. Changes to
  // a chat's terminals come as events.
  rpc OpenTerminal(OpenTerminalRequest) returns (OpenTerminalResponse);
  rpc ListTerminals(ListTerminalsRequest) returns (ListTerminalsResponse);
  // Streams a terminal's output: first what it kept (the last 1 MB, maybe
  // empty), then new output, and a last message once its shell has exited.
  // A client that falls far behind is cut off and attaches again.
  rpc AttachTerminal(AttachTerminalRequest) returns (stream AttachTerminalResponse);
  rpc WriteTerminal(WriteTerminalRequest) returns (WriteTerminalResponse);
  rpc ResizeTerminal(ResizeTerminalRequest) returns (ResizeTerminalResponse);
  // Names a terminal; an empty name goes back to the one it shows by
  // itself.
  rpc RenameTerminal(RenameTerminalRequest) returns (RenameTerminalResponse);
  // Puts a chat's terminals in an order.
  rpc ArrangeTerminals(ArrangeTerminalsRequest) returns (ArrangeTerminalsResponse);
  // Starts a new shell in a terminal's folder in place of its old one (a
  // shell that exited), keeping its place and name.
  rpc RestartTerminal(RestartTerminalRequest) returns (RestartTerminalResponse);
  // Closes a terminal: its shell is hung up, then killed after a short
  // grace, along with what still runs in it.
  rpc CloseTerminal(CloseTerminalRequest) returns (CloseTerminalResponse);
  // Says what a folder brings for the agent to run on its own (MCP
  // servers, hooks, helper commands) when neither the agent nor Nushi was
  // told to trust it; nothing when it is trusted or brings nothing. Ask
  // before starting or moving a chat there.
  rpc CheckFolder(CheckFolderRequest) returns (CheckFolderResponse);
  // Remembers that the user starts chats in a folder anyway (its
  // repository, outside git the folders under it too).
  rpc TrustFolder(TrustFolderRequest) returns (TrustFolderResponse);
  // Remote access (ADRs 0033, 0034): how it stands, and switching it on
  // or off through a relay.
  rpc GetRemote(GetRemoteRequest) returns (GetRemoteResponse);
  rpc SetRemote(SetRemoteRequest) returns (SetRemoteResponse);
  // Starts pairing a phone (remote access must be on): the text for the QR
  // code, good until it expires. Once a phone holding it connects,
  // Remote.pairing has its name and the code both screens show.
  rpc StartPairing(StartPairingRequest) returns (StartPairingResponse);
  // Allows or denies the phone that connected, named by its code.
  rpc ConfirmPairing(ConfirmPairingRequest) returns (ConfirmPairingResponse);
  // Unpairs a phone and drops its connections.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  // Web Push (ADR 0054). The daemon's VAPID public key, for a device's
  // pushManager.subscribe.
  rpc GetPushKey(GetPushKeyRequest) returns (GetPushKeyResponse);
  // A paired device's own push subscription (an empty endpoint: none);
  // only on a device's channel. The endpoint must be a known push service.
  rpc SetPushSubscription(SetPushSubscriptionRequest) returns (SetPushSubscriptionResponse);
  // The chat a client shows ("" none), said again within 40 s while it
  // does: that chat is seen (Chat.unseen), and no push for it goes to the
  // device while it's connected. On the Mac's socket it's the Mac's window
  // (API 76; before, only on a device's channel).
  rpc SetDeviceView(SetDeviceViewRequest) returns (SetDeviceViewResponse);
  // Sends a test notification to a device (the Mac's).
  rpc SendTestPush(SendTestPushRequest) returns (SendTestPushResponse);
  // Unpairs the device that calls (its Forget this Mac), as Revoke would;
  // only on a device's channel.
  rpc UnpairThisDevice(UnpairThisDeviceRequest) returns (UnpairThisDeviceResponse);
  // Writes a line of the app's into the daemon's log (source=app): its
  // errors with their stacks, and what helps afterwards.
  rpc Log(LogRequest) returns (LogResponse);
  // Jira (ADR 0042): the sites added, their tokens in the keychain. Every
  // call that reaches Jira is one the user made; nothing polls or writes on
  // its own.
  rpc ListJiraSites(ListJiraSitesRequest) returns (ListJiraSitesResponse);
  // Checks a token on a site (classic or scoped) and keeps it: the token
  // in the keychain, the site in the list.
  rpc AddJiraSite(AddJiraSiteRequest) returns (AddJiraSiteResponse);
  // Forgets a site and deletes its token from the keychain.
  rpc RemoveJiraSite(RemoveJiraSiteRequest) returns (RemoveJiraSiteResponse);
  // Asks Jira who a site's token is, to see it still works.
  rpc CheckJiraSite(CheckJiraSiteRequest) returns (CheckJiraSiteResponse);
  // Reads a site's token with macOS's prompt, which asks to let this
  // build of Nushi read it (JiraSite.needs_ok).
  rpc AllowJiraToken(AllowJiraTokenRequest) returns (AllowJiraTokenResponse);
  // The board whose active sprint is the sprint list, and saved searches.
  rpc ListJiraBoards(ListJiraBoardsRequest) returns (ListJiraBoardsResponse);
  rpc SetJiraBoard(SetJiraBoardRequest) returns (SetJiraBoardResponse);
  rpc SetJiraSearches(SetJiraSearchesRequest) returns (SetJiraSearchesResponse);
  // A list's issues: "mine", "sprint", or a JQL search.
  rpc ListJiraIssues(ListJiraIssuesRequest) returns (ListJiraIssuesResponse);
  // What the JQL field autocompletes from, and a field's values.
  rpc GetJiraJql(GetJiraJqlRequest) returns (GetJiraJqlResponse);
  rpc SuggestJiraJql(SuggestJiraJqlRequest) returns (SuggestJiraJqlResponse);
  // An issue whole, text as Markdown.
  rpc GetJiraIssue(GetJiraIssueRequest) returns (GetJiraIssueResponse);
  rpc ListJiraTransitions(ListJiraTransitionsRequest) returns (ListJiraTransitionsResponse);
  rpc TransitionJiraIssue(TransitionJiraIssueRequest) returns (TransitionJiraIssueResponse);
  // Posts a comment written in Markdown.
  rpc AddJiraComment(AddJiraCommentRequest) returns (AddJiraCommentResponse);
  // An issue for a new chat: from its link, its key, or words of it.
  rpc FindJiraIssues(FindJiraIssuesRequest) returns (FindJiraIssuesResponse);
  // An attachment's file or thumbnail (20 MB at most).
  rpc GetJiraAttachment(GetJiraAttachmentRequest) returns (GetJiraAttachmentResponse);
  // GitHub (ADR 0045): the hosts gh is signed in to (its token read by the
  // daemon through go-gh) and those given a pasted token (the keychain).
  // Nothing reaches GitHub on its own: the app asks, and marks the asking
  // on its timers quiet, which a rate limit running low holds back.
  rpc ListGitHubHosts(ListGitHubHostsRequest) returns (ListGitHubHostsResponse);
  // Checks a pasted token on a host and keeps it in the keychain; it's
  // used for the host instead of gh's login until removed.
  rpc AddGitHubToken(AddGitHubTokenRequest) returns (AddGitHubTokenResponse);
  rpc RemoveGitHubToken(RemoveGitHubTokenRequest) returns (RemoveGitHubTokenResponse);
  // Reads a host's pasted token with macOS's prompt (GitHubHost.needs_ok).
  rpc AllowGitHubToken(AllowGitHubTokenRequest) returns (AllowGitHubTokenResponse);
  // The GitHub repositories folders are clones of: the folders asked
  // about and the chats'.
  rpc ListGitHubRepos(ListGitHubReposRequest) returns (ListGitHubReposResponse);
  // Review requested of me or my teams, my pull requests, issues assigned
  // to me: the latest 50 each.
  rpc ListGitHubInbox(ListGitHubInboxRequest) returns (ListGitHubInboxResponse);
  // Items as they are now, by node id (a chat's status chip).
  rpc GetGitHubStates(GetGitHubStatesRequest) returns (GetGitHubStatesResponse);
  rpc GetGitHubPull(GetGitHubPullRequest) returns (GetGitHubPullResponse);
  rpc GetGitHubIssue(GetGitHubIssueRequest) returns (GetGitHubIssueResponse);
  // A pull request's files from its merge base to its head, both sides'
  // texts, as GetDiff gives them.
  rpc GetGitHubFiles(GetGitHubFilesRequest) returns (GetGitHubFilesResponse);
  // The end of a failed Actions job's log (16 KB).
  rpc GetGitHubJobLog(GetGitHubJobLogRequest) returns (GetGitHubJobLogResponse);
  // A message for a chat's agent, for the box (never sent by Nushi):
  // "fix_checks" (the failed checks with their logs' ends) or
  // "address_comments" (the threads named, else all not resolved), GitHub's
  // text in it marked as data.
  rpc GetGitHubPrompt(GetGitHubPromptRequest) returns (GetGitHubPromptResponse);
  // The user's writes.
  rpc ReplyGitHubThread(ReplyGitHubThreadRequest) returns (ReplyGitHubThreadResponse);
  rpc ResolveGitHubThread(ResolveGitHubThreadRequest) returns (ResolveGitHubThreadResponse);
  rpc AddGitHubComment(AddGitHubCommentRequest) returns (AddGitHubCommentResponse);
  rpc SubmitGitHubReview(SubmitGitHubReviewRequest) returns (SubmitGitHubReviewResponse);
  // Re-runs the failed jobs of the workflow runs that a pull request's
  // failed Actions jobs belong to. API 88.
  rpc RerunGitHubChecks(RerunGitHubChecksRequest) returns (RerunGitHubChecksResponse);
  // Cleaning up after a chat's pull request: what the chat's worktree and
  // branch would lose (GetCleanUp), removing the worktree, deleting its
  // branch, and the pull request's branch on GitHub deleted or made again.
  // API 89.
  rpc GetCleanUp(GetCleanUpRequest) returns (GetCleanUpResponse);
  // Refused mid-turn, while another chat works in the worktree, and with
  // uncommitted changes unless force. API 89.
  rpc RemoveChatWorktree(RemoveChatWorktreeRequest) returns (RemoveChatWorktreeResponse);
  // Refused while a worktree has the branch checked out, and with commits
  // its base doesn't have unless force. API 89.
  rpc DeleteChatBranch(DeleteChatBranchRequest) returns (DeleteChatBranchResponse);
  // A merged or closed pull request's head branch, only while it points at
  // the pull request's head; never the default branch. API 89.
  rpc DeleteGitHubBranch(DeleteGitHubBranchRequest) returns (DeleteGitHubBranchResponse);
  // That branch made again at the pull request's head. API 89.
  rpc RestoreGitHubBranch(RestoreGitHubBranchRequest) returns (RestoreGitHubBranchResponse);
  // A chat's pull request: the one it was started from, else the one whose
  // head is its folder's branch, looked for on GitHub (and linked when
  // found), with the folder's repository and branch. API 81.
  rpc FindChatPull(FindChatPullRequest) returns (FindChatPullResponse);
  // Links a pull request picked by hand to a chat, or unlinks its own.
  // API 81.
  rpc LinkChatPull(LinkChatPullRequest) returns (LinkChatPullResponse);
  // Streams every change to every chat from now on. The first message is
  // empty: it says the subscription is live.
  rpc Events(EventsRequest) returns (stream EventsResponse);
}

message PingRequest {}

message PingResponse {
  // Bumped when the API grows; it only grows (ADR 0004).
  int32 api_version = 1;
  // The daemon's executable as it started, "<size>-<mtime in ms>": the app
  // compares it with the daemon it bundles, to offer a restart into a
  // newer one.
  string build = 2;
  // The release it was packaged as ("1.2.0"), "" for a build that wasn't
  // (API 74).
  string version = 3;
  // What its check for a newer release found (API 86).
  UpdateCheck update = 4;
}

// What the daemon's check for a newer release of Nushi found: GitHub's
// latest release (not a draft or a pre-release), compared with the
// daemon's own version. A build that isn't a release never has a newer
// one; nor does any while Settings.check_updates is off.
message UpdateCheck {
  // The newer release, when there is one: its version ("0.1.17"), its
  // page on GitHub, and when it was published.
  string version = 1;
  string url = 2;
  int64 published_ms = 3;
  // The latest release, newer or not; "" until GitHub has answered.
  string latest = 4;
  // When GitHub last answered; 0: not yet.
  int64 checked_ms = 5;
}

message CheckForUpdatesRequest {}

message CheckForUpdatesResponse {
  UpdateCheck update = 1;
}

message RestartWhenIdleRequest {}

message RestartWhenIdleResponse {
  // What the restart waits for now (API 85): each chat that runs or waits,
  // and each terminal running a command; empty when nothing (it goes).
  repeated RestartHold holds = 1;
}

// One thing a restart waits for.
message RestartHold {
  // The chat it's in (a terminal's chat too).
  string chat_id = 1;
  // "working", "waits on you", "a message queued", "in background", or
  // for a terminal "running <its program>".
  string why = 2;
  // A terminal's, not the chat's own.
  bool terminal = 3;
}

message ListChatsRequest {}

message ListChatsResponse {
  repeated Chat chats = 1;
  // Chats the daemon removed since it started because their agent no
  // longer has their sessions (Claude Code deletes old ones), until
  // DismissRemovedChats; oldest first.
  repeated RemovedChat removed = 2;
}

// A chat the daemon removed, its agent having deleted its session: what
// Nushi kept of it. Its worktree and branch, if any, stay.
message RemovedChat {
  string id = 1;
  string agent = 2;
  string title = 3;
  string folder = 4;
  int64 removed_unix_ms = 5;
}

message RemovedChats {
  repeated RemovedChat chats = 1;
}

message DismissRemovedChatsRequest {
  repeated string ids = 1;
}

message DismissRemovedChatsResponse {}

// What Nushi keeps of a chat; the agent keeps the rest.
message Chat {
  // The agent's session id.
  string id = 1;
  string agent = 2;
  string folder = 3;
  // The title the user set, or else the agent's.
  string title = 4;
  // The mode it was last in.
  string mode = 5;
  int64 created_unix_ms = 6;
  // Whether it works or waits on the user, for a list of chats.
  ChatStatus status = 7;
  // Archived chats have no agent running and take no prompts.
  bool archived = 8;
  // The agent's session id (claude --resume <id>).
  string session_id = 9;
  // The git worktree the chat runs in, if it's one Nushi made for it or
  // another than its repository's own folder (found).
  Worktree worktree = 10;
  // Its folder is a scratch folder of its own: it has no folder yet.
  bool scratch = 11;
  // The Jira issue it was started from, if it was.
  string jira_site = 12;
  string jira_key = 13;
  // The GitHub pull request or issue it was started from, if it was.
  GitHubLink github = 14;
  // A turn ended (it finished, or failed with an error to read; not one
  // the user stopped) while no client showed the chat (SetDeviceView);
  // showing it, or archiving it, clears it. API 76.
  bool unseen = 15;
  // The chat's pull request: the one it was started from (github), else the
  // one whose head is its branch, found or linked by hand. API 81.
  GitHubLink pull = 16;
  // Its place among the pinned chats, from 1 (the top); 0 when it isn't
  // pinned (PinChats). API 90.
  int32 pin = 17;
}

// A git worktree of a repository, on a branch of its own.
message Worktree {
  // The repository's folder (its main worktree).
  string repo = 1;
  // The worktree's folder; the chat's folder is in it.
  string path = 2;
  // Its branch: nushi/<two words> at first, named after the chat once it
  // has a title (between turns, unless pushed or renamed), or as the user
  // renamed it (RenameBranch).
  string branch = 3;
  // The branch it started from (a commit, if HEAD was detached).
  string base = 4;
  // The commit it started from, for when its base branch is gone; empty
  // for worktrees made before daemon API 42.
  string base_commit = 5;
  // It was there already (made outside Nushi, or for another chat) when
  // the chat moved or started in it: Nushi never removes it. API 83.
  bool found = 6;
}

message GetChatRequest {
  string chat_id = 1;
  // Only the last this many items (0: all), reaching back to the tool call
  // that started a subagent whose steps are among them; `older` counts
  // the ones left out. A phone on a slow link opens a long chat this way.
  int32 recent = 2;
}

message GetChatResponse {
  Chat chat = 1;
  repeated Item items = 2;
  repeated ConfigOption config = 3;
  ChatStatus status = 4;
  // The last event this includes: apply only the chat's events after it.
  int64 seq = 5;
  // The agent's slash commands.
  repeated Command commands = 6;
  Usage usage = 7;
  // Messages waiting for the agent.
  ChatQueue queue = 8;
  // How many items come before `items` (with `recent`).
  int32 older = 9;
}

message GetChatItemsRequest {
  string chat_id = 1;
  // The item the page ends before (the first one the client has).
  string before = 2;
  // How many items at most, reaching back to a subagent's call as
  // `recent` does.
  int32 limit = 3;
}

message GetChatItemsResponse {
  repeated Item items = 1;
  // How many items come before these.
  int32 older = 2;
}

// What the agent last reported of a chat's usage; what it hasn't reported
// is zero. It starts empty when the daemon restarts.
message Usage {
  // Context tokens in use, and the context window's size (ACP
  // usage_update).
  int64 context_used = 1;
  int64 context_size = 2;
  // The session's cost so far, in currency (ISO 4217).
  double cost = 3;
  string currency = 4;
  // The last turn's tokens (the prompt response's usage).
  int64 input_tokens = 5;
  int64 output_tokens = 6;
  int64 cached_read_tokens = 7;
  int64 cached_write_tokens = 8;
}

// A slash command the agent offers; it is sent as a prompt starting with
// "/name".
message Command {
  string name = 1;
  string description = 2;
  // What to type after the name, if it takes input.
  string hint = 3;
}

message ChatCommands {
  repeated Command commands = 1;
}

message ListAgentsRequest {
  // Read the login shell's environment, which agents start with, again
  // first when the last reading is over a minute old (Settings › Agents
  // opening; ADR 0048).
  bool refresh_environment = 1;
  // Read it again now, whatever its age (Settings › Agents › Reload).
  bool reload_environment = 2;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  // How reading the login shell's environment went last; unset when
  // agents get the daemon's own. Nothing of the environment itself.
  ShellEnvironment environment = 2;
}

// How the daemon last read the login shell's environment (ADR 0048).
message ShellEnvironment {
  // The shell it ran: "/opt/homebrew/bin/fish".
  string shell = 1;
  // When the reading ended, worked or not.
  int64 read_unix_ms = 2;
  // Why it failed ("fish took over 5s"); empty when it worked. Agents
  // then start with the last reading that worked, else the daemon's own.
  string problem = 3;
}

// An agent chats can run.
message Agent {
  // As Chat.agent names it, such as "claude".
  string name = 1;
  // As people read it, such as "Claude".
  string title = 2;
  // The terminal command that opens one of its sessions, followed by the
  // session id, such as "claude --resume".
  string resume = 3;
  // Nushi shows and changes its MCP servers (ListMcpServers): Claude's,
  // and Ante's from API 80.
  bool mcp = 4;
  // Deleting a chat archives the agent's history of it rather than
  // deleting it: the resume command still offers it.
  bool delete_archives = 5;
  // Its CLI, as found on the login shell's PATH (or where its installer
  // puts it); empty when it isn't installed.
  string path = 6;
  // The CLI's version, as it says it; empty when that couldn't be read.
  string version = 7;
  // Where to get it.
  string page = 8;
  // Why it can't run, in a few words ("Not installed", "Needs Bun");
  // empty when it can.
  string problem = 9;
  // Whether the CLI is signed in, "yes" or "no", when it can tell
  // cheaply; empty otherwise.
  string signed_in = 10;
  // The npm package its ACP side comes in, when it needs one.
  Adapter adapter = 11;
  // A chat can start: it's installed, has what it needs, and its adapter
  // (if any) is set up.
  bool ready = 12;
  // Its chats whose agent runs (they sleep when the adapter changes).
  int32 awake = 13;
}

// An agent's adapter.
message Adapter {
  // "@agentclientprotocol/claude-agent-acp".
  string package = 1;
  // The version Nushi pins, and the one set up (empty when it isn't).
  string pinned = 2;
  string installed = 3;
  // How many packages it installs, the adapter's included.
  int32 packages = 4;
  // About how much it downloads, and takes on disk, in bytes.
  int64 download_bytes = 5;
  int64 disk_bytes = 6;
  // Where it goes.
  string folder = 7;
}

