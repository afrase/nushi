message GitHubRepo {
  string host = 1;
  // owner/name.
  string repo = 2;
  repeated string folders = 3;
}

message ListGitHubReposRequest {
  repeated string folders = 1;
}

message ListGitHubReposResponse {
  repeated GitHubRepo repos = 1;
}

// A pull request or an issue: its host, repository and number.
message GitHubRef {
  string host = 1;
  string repo = 2;
  int32 number = 3;
}

// A pull request or an issue as a list shows it.
message GitHubItem {
  GitHubRef ref = 1;
  // GitHub's node id.
  string id = 2;
  bool pull = 3;
  string title = 4;
  string url = 5;
  // "open", "closed" or "merged".
  string state = 6;
  bool draft = 7;
  string author = 8;
  int64 updated_ms = 9;
  // A pull request's checks: "success", "failure", "pending", or "".
  string checks = 10;
  // Its review decision: "approved", "changes_requested",
  // "review_required", or "".
  string review = 11;
  // Its review threads not resolved.
  int32 unresolved = 12;
  int32 comments = 13;
}

message ListGitHubInboxRequest {
  string host = 1;
  // Only these repositories' (owner/name); empty for all.
  repeated string repos = 2;
  // The app's timer asking: held back while a rate limit is low.
  bool quiet = 3;
  // Review requested includes pull requests asked of a team of mine
  // (GitHub's review-requested:@me); else only those asking me by name
  // (user-review-requested:@me).
  bool teams = 4;
  // The inbox as GitHub gave it last, kept by the daemon, without asking
  // GitHub: shown at once while it's asked for (at_ms 0 when none).
  bool cached = 5;
  // Only what changed in the last this many days (0: any time), in the
  // search itself; except the sections named in wide ("review", "mine",
  // "assigned").
  int32 updated_days = 6;
  repeated string wide = 7;
  // Never these repositories (owner/name) or owners' (a user or an
  // organization), in the search itself.
  repeated string hide = 8;
  // Only these owners' repositories (10 at most); none for all.
  repeated string owners = 9;
}

message ListGitHubInboxResponse {
  repeated GitHubItem review = 1;
  repeated GitHubItem mine = 2;
  repeated GitHubItem assigned = 3;
  // How many each search found (50 are listed at most).
  int32 review_total = 4;
  int32 mine_total = 5;
  int32 assigned_total = 6;
  // When GitHub said so; with stale, why it couldn't say again.
  int64 at_ms = 7;
  string stale = 8;
  // How many more each search finds without updated_days (0 without it,
  // or for a wide section).
  int32 review_older = 9;
  int32 mine_older = 10;
  int32 assigned_older = 11;
}

// A pull request or an issue a chat is on: its host and node id, and its
// repository and number.
message GitHubLink {
  string host = 1;
  string id = 2;
  string repo = 3;
  int32 number = 4;
  bool pull = 5;
}

message FindChatPullRequest {
  string chat_id = 1;
  // Asked on the app's timer: held back while the rate limit runs low.
  bool quiet = 2;
}

message FindChatPullResponse {
  // The folder's GitHub repository and branch; host is empty when the
  // folder isn't a clone of one on a host signed in to, or has no branch
  // checked out.
  string host = 1;
  string repo = 2;
  string branch = 3;
  // The branch is the repository's default: no pull request is looked for.
  bool default_branch = 4;
  // The chat's pull request, if it has one.
  GitHubLink pull = 5;
  // Why GitHub couldn't be asked this time (the link stays as it was).
  string error = 6;
}

message LinkChatPullRequest {
  string chat_id = 1;
  // The pull request to link; none unlinks the chat's.
  GitHubLink pull = 2;
}

message LinkChatPullResponse {}

message GetGitHubStatesRequest {
  repeated GitHubLink items = 1;
  bool quiet = 2;
}

message GetGitHubStatesResponse {
  // The ones known, as they are now (or last were).
  repeated GitHubItem items = 1;
}

// A comment, or a review that said something; body is Markdown as
// GitHub's page shows it.
message GitHubComment {
  string id = 1;
  string author = 2;
  // GitHub's author association: OWNER, MEMBER, COLLABORATOR,
  // CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, NONE…
  string association = 3;
  // The author isn't the repository's owner, a member or a collaborator.
  bool outside = 4;
  bool bot = 5;
  string body = 6;
  string url = 7;
  int64 created_ms = 8;
  // A review's state ("approved", "changes_requested", "commented",
  // "dismissed"); empty for a comment.
  string review = 9;
  // The head commit a review was made on (its oid); empty for a comment.
  string commit = 10;
}

// A review thread on line (from start_line) of path's side ("left", the
// base; "right", the head), or on the file. An outdated one's lines are
// the original ones.
message GitHubThread {
  string id = 1;
  string path = 2;
  string side = 3;
  int32 line = 4;
  int32 start_line = 5;
  int32 original_line = 6;
  int32 original_start_line = 7;
  bool on_file = 8;
  bool outdated = 9;
  bool resolved = 10;
  bool can_reply = 11;
  bool can_resolve = 12;
  bool can_unresolve = 13;
  repeated GitHubComment comments = 14;
}

message GitHubAnnotation {
  string path = 1;
  // "failure", "warning", "notice".
  string level = 2;
  string title = 3;
  string message = 4;
  int32 line = 5;
  int32 end_line = 6;
}

// A check run (id is its id, an Actions job's) or a commit status (id 0).
message GitHubCheck {
  int64 id = 1;
  string name = 2;
  string workflow = 3;
  string app = 4;
  // "pending" until it ends, then its conclusion: "success", "failure",
  // "cancelled", "skipped", "neutral", "timed_out"…
  string state = 5;
  bool failed = 6;
  string url = 7;
  string title = 8;
  // Markdown as GitHub's page shows it.
  string summary = 9;
  bool required = 10;
  repeated GitHubAnnotation annotations = 11;
  int64 started_ms = 12;
  int64 completed_ms = 13;
}

// Someone asked to review ("requested"), or who did ("approved",
// "changes_requested", "commented", "dismissed"); a team asked has team.
message GitHubReviewer {
  string login = 1;
  string state = 2;
  bool team = 3;
  // Asked as a code owner of what the pull request changes.
  bool code_owner = 4;
}

message GitHubPull {
  GitHubItem item = 1;
  string body = 2;
  string association = 3;
  bool outside = 4;
  string base = 5;
  string head = 6;
  // The head's repository (owner/name): another one for a fork's.
  string head_repo = 7;
  bool cross_repo = 8;
  string base_oid = 9;
  string head_oid = 10;
  // "mergeable", "conflicting", "unknown".
  string mergeable = 11;
  // "clean", "blocked", "behind", "dirty", "unstable", "has_hooks",
  // "unknown".
  string merge_state = 12;
  int32 additions = 13;
  int32 deletions = 14;
  int32 changed_files = 15;
  repeated GitHubReviewer reviewers = 16;
  // Comments and reviews that said something, oldest first.
  repeated GitHubComment conversation = 17;
  repeated GitHubThread threads = 18;
  repeated GitHubCheck checks = 19;
  // My review pending on GitHub (made in the browser), which a review
  // submitted here joins, and its comments' count.
  string pending_review = 20;
  int32 pending_comments = 21;
  // Its commits.
  int32 commits = 22;
}

message GetGitHubPullRequest {
  GitHubRef ref = 1;
  bool quiet = 2;
}

message GetGitHubPullResponse {
  GitHubPull pull = 1;
}

message GitHubIssue {
  GitHubItem item = 1;
