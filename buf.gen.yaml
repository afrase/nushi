version: v2
clean: true
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-dart
    out: app/lib/gen
  - local: protoc-gen-connect-dart
    out: app/lib/gen
