query PullRequest($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      __typename ...ItemPull
      body viewerCanUpdate authorAssociation baseRefOid headRefOid isCrossRepository
      reactionGroups { content viewerHasReacted reactors { totalCount } }
      headRepository { nameWithOwner }
      mergeable
      canBeRebased viewerCanMergeAsAdmin viewerCanEnableAutoMerge viewerCanDisableAutoMerge isMergeQueueEnabled
      autoMergeRequest { mergeMethod enabledBy { login } }
      mergeQueueEntry { position state estimatedTimeToMerge enqueuer { login } }
      mergeQueue { configuration { mergeMethod } }
      baseRef { refUpdateRule { requiresConversationResolution requiresLinearHistory } }
      repo: repository { mergeCommitAllowed squashMergeAllowed rebaseMergeAllowed autoMergeAllowed deleteBranchOnMerge viewerDefaultMergeMethod viewerPermission }
      commitCount: commits { totalCount }
      labels(first: 20) { nodes { name color } }
      assignees(first: 10) { nodes { login } }
      reviewRequests(first: 30) { nodes { asCodeOwner requestedReviewer { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } ... on Team { slug } } } }
      latestReviews(first: 30) { nodes { author { login } state } }
      comments(last: 100) { nodes { id url author { login __typename } authorAssociation body createdAt reactionGroups { content viewerHasReacted reactors { totalCount } } } }
      reviews(last: 100) { nodes { id url author { login __typename } authorAssociation body state submittedAt commit { oid } reactionGroups { content viewerHasReacted reactors { totalCount } } } }
      pending: reviews(first: 1, states: PENDING) { nodes { id comments { totalCount } } }
      threads: reviewThreads(first: 100) { pageInfo { hasNextPage endCursor } nodes { ...Thread } }
      last: commits(last: 1) { nodes { commit { statusCheckRollup { contexts(first: 100) { nodes {
        __typename
        ... on CheckRun { databaseId name status conclusion detailsUrl title summary startedAt completedAt
          isRequired(pullRequestNumber: $number)
          checkSuite { app { name } workflowRun { workflow { name } } }
          annotations(first: 10) { nodes { path title message annotationLevel location { start { line } } } } }
        ... on StatusContext { context state targetUrl description createdAt isRequired(pullRequestNumber: $number) }
      } } } } } }
    }
  }
}
fragment Thread on PullRequestReviewThread {
  id path line startLine originalLine originalStartLine diffSide subjectType
  isOutdated isResolved viewerCanReply viewerCanResolve viewerCanUnresolve
  comments(first: 50) { nodes { id url author { login __typename } authorAssociation body createdAt pullRequestReview { id } reactionGroups { content viewerHasReacted reactors { totalCount } } } }
  hunk: comments(first: 1) { nodes { diffHunk } }
}
fragment ItemPull on PullRequest {
  id number title url state isDraft createdAt updatedAt
  author { login }
  repository { nameWithOwner }
  additions deletions changedFiles mergeStateStatus baseRefName headRefName
  reviewDecision totalCommentsCount
  commits(last: 1) { nodes { commit { oid statusCheckRollup { state  } } } }
  reviewThreads(first: 100) { nodes { isResolved } }
}
