query Issue($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      __typename ...ItemIssue body authorAssociation
      labels(first: 20) { nodes { name } }
      assignees(first: 10) { nodes { login } }
      comments(last: 100) { nodes { id url author { login __typename } authorAssociation body createdAt reactionGroups { content viewerHasReacted reactors { totalCount } } } }
    }
  }
}
fragment ItemIssue on Issue {
  id number title url state stateReason createdAt updatedAt
  author { login }
  repository { nameWithOwner }
  commentCount: comments { totalCount }
}
